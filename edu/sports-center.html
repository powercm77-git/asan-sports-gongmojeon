  localStorage.setItem("sportsAppLang", lang);
  state.catId = CATEGORIES[0].id;
  state.exIndex = 0;
  state.pronIndex = 0;
  state.quizIndex = 0;
  state.quizScore = 0;
  state.quizAnswered = false;
  state.quizDone = false;
  state.quizOrder = null;
  renderCategorySelect();
  renderExampleSelect();
  renderGate();
  renderMain();
  updateLangButtons();
}

function updateLangButtons() {
  const enBtn = document.getElementById('langEnBtn');
  const jaBtn = document.getElementById('langJaBtn');
  if (enBtn && jaBtn) {
    enBtn.classList.toggle('lang-active', currentLang === 'en');
    jaBtn.classList.toggle('lang-active', currentLang === 'ja');
  }
}


// ============================================================
// State
// ============================================================
let state = {
  catId: CATEGORIES[0].id,
  tab: "vocab",
  exIndex: 0,      // 0~9 (예제 1~10)
  pronIndex: 0,
  quizIndex: 0,
  quizScore: 0,
  quizAnswered: false,
  quizDone: false,
  quizOrder: null,
  progress: JSON.parse(localStorage.getItem("sportsEngProgressV2") || "{}"),
};

function saveProgress() {
  localStorage.setItem("sportsEngProgressV2", JSON.stringify(state.progress));
}

function markVisited(catId, tab) {
  if (!state.progress[catId]) state.progress[catId] = {};
  state.progress[catId][tab] = true;
  saveProgress();
  renderGate();
}

// ============================================================
// TTS (Text-to-Speech) - 여성/남성 목소리 구분, 30% 이상 느린 속도
// ============================================================
let voiceList = [];
let femaleVoice = null;
let maleVoice = null;
let voiceListJa = [];
let femaleVoiceJa = null;
let maleVoiceJa = null;

function loadVoices() {
  const allVoices = window.speechSynthesis.getVoices();

  // 영어 음성
  voiceList = allVoices.filter(v => v.lang.startsWith('en'));
  const femaleNames = /female|samantha|victoria|karen|moira|tessa|susan|zira|jenny|aria|emma|joanna|salli|kendra|kimberly|ava|allison/i;
  const maleNames = /male|daniel|alex|fred|david|james|guy|matthew|tom|ryan|brian/i;
  femaleVoice = voiceList.find(v => femaleNames.test(v.name)) || voiceList.find(v => v.name.toLowerCase().includes('google') && v.name.toLowerCase().includes('female'));
  maleVoice = voiceList.find(v => maleNames.test(v.name));
  if (!femaleVoice && voiceList.length > 0) femaleVoice = voiceList[0];
  if (!maleVoice && voiceList.length > 1) maleVoice = voiceList.find(v => v !== femaleVoice) || voiceList[1];
  if (!maleVoice) maleVoice = femaleVoice;

  // 일본어 음성
  voiceListJa = allVoices.filter(v => v.lang.startsWith('ja'));
  femaleVoiceJa = voiceListJa.find(v => v.name.toLowerCase().includes('female')) || voiceListJa[0];
  maleVoiceJa = voiceListJa.find(v => v.name.toLowerCase().includes('male')) || voiceListJa[1] || voiceListJa[0];
  if (!maleVoiceJa) maleVoiceJa = femaleVoiceJa;
}

if ('speechSynthesis' in window) {
  loadVoices();
  window.speechSynthesis.onvoiceschanged = loadVoices;
}

function speak(text, btnEl, gender) {
  if (!('speechSynthesis' in window)) {
    alert('이 브라우저는 음성 재생을 지원하지 않습니다.');
    return;
  }
  window.speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  const isJa = currentLang === 'ja';
  utter.lang = isJa ? 'ja-JP' : 'en-US';
  utter.rate = 0.6;
  utter.pitch = gender === 'male' ? 0.92 : 1.05;

  const v = isJa
    ? (gender === 'male' ? maleVoiceJa : femaleVoiceJa)
    : (gender === 'male' ? maleVoice : femaleVoice);
  if (v) utter.voice = v;

  if (btnEl) {
    btnEl.classList.add('playing');
    utter.onend = () => btnEl.classList.remove('playing');
    utter.onerror = () => btnEl.classList.remove('playing');
  }
  window.speechSynthesis.speak(utter);
}

// ============================================================
// Render: Category dropdown
// ============================================================
function renderCategorySelect() {
  const el = document.getElementById('catSelect');
  el.innerHTML = CATEGORIES.map(c => `<option value="${c.id}">${c.icon} ${c.title}</option>`).join('');
  el.value = state.catId;
  el.addEventListener('change', () => {
    state.catId = el.value;
    state.exIndex = 0;
    state.pronIndex = 0;
    state.quizIndex = 0;
    state.quizScore = 0;
    state.quizAnswered = false;
    state.quizDone = false;
    renderExampleSelect();
    renderMain();
  });
}

// ============================================================
// Render: Example number dropdown (1~10)
// ============================================================
function renderExampleSelect() {
  const el = document.getElementById('exSelect');
  const labels = EXAMPLE_LABELS[state.catId] || [];
  el.innerHTML = labels.map((name, i) => `<option value="${i}">${i + 1}. ${name}</option>`).join('');
  el.value = state.exIndex;
  el.onchange = () => {
    state.exIndex = parseInt(el.value);
    state.pronIndex = state.exIndex;
    renderMain();
  };
}

// ============================================================
// Render: Gate progress (17 categories)
// ============================================================
function renderGate() {
  const el = document.getElementById('gateProgress');
  el.innerHTML = CATEGORIES.map(c => {
    const p = state.progress[c.id] || {};
    const done = ['vocab','pron','dialogue','quiz'].filter(t => p[t]).length;
    const pct = Math.round((done / 4) * 100);
    return `<div class="gate-stamp"><i style="width:${pct}%"></i></div>`;
  }).join('');
  const totalDone = CATEGORIES.filter(c => {
    const p = state.progress[c.id] || {};
    return ['vocab','pron','dialogue','quiz'].every(t => p[t]);
  }).length;
  document.getElementById('gateLabel').textContent = `전체 진행: ${totalDone} / ${CATEGORIES.length} 상황 완료`;
}

// ============================================================
// Render: Tabs
// ============================================================
function renderTabs() {
  document.querySelectorAll('.tab').forEach(t => {
    t.classList.toggle('active', t.dataset.tab === state.tab);
  });
}

document.querySelectorAll('.tab').forEach(t => {
  t.addEventListener('click', () => {
    state.tab = t.dataset.tab;
    renderTabs();
    renderMain();
  });
});

// ============================================================
// Render: Main content per tab
// ============================================================
function renderMain() {
  renderTabs();
  const cat = CATEGORIES.find(c => c.id === state.catId);
  const main = document.getElementById('mainContent');

  if (state.tab === 'vocab') {
    markVisited(state.catId, 'vocab');
    const words = VOCAB[state.catId];
    main.innerHTML = `
      <div class="section-title">${cat.icon} ${cat.title} · 핵심 단어 (전체 ${words.length}개)</div>
      ${words.map((w) => `
        <div class="vocab-card">
          <div>
            <div class="vocab-en">${w.en}</div>
            <div class="vocab-pron">${w.pron}</div>
            <div class="vocab-ko">${w.ko}</div>
          </div>
          <button class="play-btn" data-text="${escapeAttr(w.en)}">▶</button>
        </div>
      `).join('')}
    `;
    main.querySelectorAll('.play-btn').forEach(btn => {
      btn.addEventListener('click', () => speak(btn.dataset.text, btn, 'female'));
    });
  }

  else if (state.tab === 'pron') {
    markVisited(state.catId, 'pron');
    const words = VOCAB[state.catId];
    const idx = state.exIndex;
    const w = words[idx];
    main.innerHTML = `
      <div class="section-title">${cat.icon} ${cat.title} · 발음 연습</div>
      <div class="pron-card">
        <div class="pron-en">${w.en}</div>
        <div class="pron-kr">${w.pron}</div>
        <div class="pron-ko">${w.ko}</div>
        <div class="pron-controls">
          <button class="btn btn-primary" id="pronPlayBtn">🔊 듣기</button>
          <button class="btn btn-secondary" id="pronSlowBtn">🐢 천천히</button>
        </div>
      </div>
      <div class="pron-nav-row">
        <button class="btn-nav" id="pronPrev">‹</button>
        <div class="pron-counter">단어 ${idx + 1} / ${words.length}</div>
        <button class="btn-nav" id="pronNext">›</button>
      </div>
    `;
    document.getElementById('pronPlayBtn').addEventListener('click', (e) => speak(w.en, e.target, 'female'));
    document.getElementById('pronSlowBtn').addEventListener('click', () => {
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(w.en);
      u.lang = 'en-US';
      u.rate = 0.4;
      u.pitch = 1.05;
      if (femaleVoice) u.voice = femaleVoice;
      window.speechSynthesis.speak(u);
    });
    document.getElementById('pronPrev').addEventListener('click', () => {
      state.exIndex = (state.exIndex - 1 + words.length) % words.length;
      syncExampleSelect();
      renderMain();
    });
    document.getElementById('pronNext').addEventListener('click', () => {
      state.exIndex = (state.exIndex + 1) % words.length;
      syncExampleSelect();
      renderMain();
    });
  }

  else if (state.tab === 'dialogue') {
    markVisited(state.catId, 'dialogue');
    const lines = DIALOGUES[state.catId][state.exIndex];
    main.innerHTML = `
      <div class="section-title">${cat.icon} ${cat.title} · 실전 대화 예제 ${state.exIndex + 1}</div>
      ${lines.map(l => `
        <div class="dialogue-row ${l.speaker}">
          <div class="bubble">
            <div class="bubble-tag">${l.speaker === 'visitor' ? '👨 방문객 Visitor' : '👩 근무자 Staff'}</div>
            <div class="bubble-en">${l.en}</div>
            ${l.pron ? `<div class="bubble-pron">${l.pron}</div>` : ''}
            <div class="bubble-ko">${l.ko}</div>
            <button class="bubble-play" data-text="${escapeAttr(l.en)}" data-gender="${l.speaker === 'visitor' ? 'male' : 'female'}">▶</button>
          </div>
        </div>
      `).join('')}
      <div class="dialogue-actions">
        <button class="btn btn-primary" id="playAllBtn">🔊 전체 듣기</button>
      </div>
      <div class="ex-nav-row">
        <button class="btn-nav" id="exPrev">‹</button>
        <div class="ex-counter">예제 ${state.exIndex + 1} / 10</div>
        <button class="btn-nav" id="exNext">›</button>
      </div>
    `;
    main.querySelectorAll('.bubble-play').forEach(btn => {
      btn.addEventListener('click', () => speak(btn.dataset.text, btn, btn.dataset.gender));
    });
    document.getElementById('playAllBtn').addEventListener('click', () => playAllLines(lines, 0));
    document.getElementById('exPrev').addEventListener('click', () => {
      const diagLen = DIALOGUES[state.catId].length;
      state.exIndex = (state.exIndex - 1 + diagLen) % diagLen;
      syncExampleSelect();
      renderMain();
    });
    document.getElementById('exNext').addEventListener('click', () => {
      const diagLen2 = DIALOGUES[state.catId].length;
      state.exIndex = (state.exIndex + 1) % diagLen2;
      syncExampleSelect();
      renderMain();
    });
  }

  else if (state.tab === 'quiz') {
    renderQuiz(cat);
  }
}

function syncExampleSelect() {
  const el = document.getElementById('exSelect');
  if (el) el.value = state.exIndex;
}

function playAllLines(lines, idx) {
  if (idx >= lines.length) return;
  window.speechSynthesis.cancel();
  const line = lines[idx];
  const u = new SpeechSynthesisUtterance(line.en);
  u.lang = 'en-US';
  u.rate = 0.6;
  const gender = line.speaker === 'visitor' ? 'male' : 'female';
  u.pitch = gender === 'male' ? 0.92 : 1.05;
  const v = gender === 'male' ? maleVoice : femaleVoice;
  if (v) u.voice = v;
  u.onend = () => setTimeout(() => playAllLines(lines, idx + 1), 400);
  window.speechSynthesis.speak(u);
}

function escapeAttr(s) {
  return s.replace(/"/g, '&quot;');
}

// ============================================================
// Quiz logic
// ============================================================
function renderQuiz(cat) {
  const main = document.getElementById('mainContent');
  const rawQuizzes = QUIZZES[state.catId];

  // 진입 시 셔플 순서 초기화
  if (!state.quizOrder || state.quizOrder.length !== rawQuizzes.length) {
    state.quizOrder = Array.from({length: rawQuizzes.length}, (_, i) => i);
    for (let i = state.quizOrder.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [state.quizOrder[i], state.quizOrder[j]] = [state.quizOrder[j], state.quizOrder[i]];
    }
  }
  const quizzes = state.quizOrder.map(i => rawQuizzes[i]);
  const total = quizzes.length;
  const pct = Math.round((state.quizIndex / total) * 100);

  if (state.quizDone) {
    const grade = state.quizScore >= 18 ? '🏆 완벽해요!' :
                  state.quizScore >= 14 ? '👍 잘했어요!' :
                  state.quizScore >= 10 ? '📚 조금 더 연습해요!' : '💪 다시 도전!';
    main.innerHTML = `
      <div class="section-title">${cat.icon} ${cat.title} · 퀴즈 결과</div>
      <div class="quiz-progress-bar-wrap"><div class="quiz-progress-bar" style="width:100%"></div></div>
      <div class="quiz-card quiz-result">
        <div class="score">${state.quizScore} / ${total}</div>
        <div class="score-label">${grade}</div>
        <div style="margin-top:8px;font-size:13px;color:#888;">📝 객관식 ${total/2}문제 + 🎧 듣기 ${total/2}문제</div>
      </div>
      <div style="display:flex;gap:8px;margin-top:12px;">
        <button class="btn btn-secondary" id="retryBtn" style="flex:1;">🔄 같은 순서로</button>
        <button class="btn btn-primary" id="shuffleRetryBtn" style="flex:1;">🎲 섞어서 다시</button>
      </div>
    `;
    document.getElementById('retryBtn').addEventListener('click', () => {
      state.quizIndex = 0; state.quizScore = 0;
      state.quizDone = false; state.quizAnswered = false;
      renderMain();
    });
    document.getElementById('shuffleRetryBtn').addEventListener('click', () => {
      state.quizIndex = 0; state.quizScore = 0;
      state.quizDone = false; state.quizAnswered = false;
      state.quizOrder = null;
      renderMain();
    });
    return;
  }

  const q = quizzes[state.quizIndex];
  const isListen = q.type === 'listen';

  main.innerHTML = `
    <div class="section-title">${cat.icon} ${cat.title} · 퀴즈</div>
    <div class="quiz-progress">문제 ${state.quizIndex + 1} / ${total} &nbsp;|&nbsp; 현재 ${state.quizScore}점</div>
    <div class="quiz-progress-bar-wrap"><div class="quiz-progress-bar" style="width:${pct}%"></div></div>
    <div class="quiz-card">
      <div class="quiz-type-tag ${q.type}">${isListen ? '🎧 듣고 맞추기' : '📝 객관식'}</div>
      <div class="quiz-question">${q.question}</div>
      ${isListen ? `<button class="quiz-listen-btn" id="quizListenBtn">🔊 문장 듣기 (다시 듣기 가능)</button>` : ''}
      <div id="quizOptions">
        ${q.options.map((opt, i) => `<button class="quiz-option" data-idx="${i}">${opt}</button>`).join('')}
      </div>
      <div id="quizFeedback"></div>
    </div>
  `;

  if (isListen) {
    const listenBtn = document.getElementById('quizListenBtn');
    listenBtn.addEventListener('click', () => speak(q.audio, listenBtn, 'female'));
  }

  document.querySelectorAll('.quiz-option').forEach(btn => {
    btn.addEventListener('click', () => {
      if (state.quizAnswered) return;
      state.quizAnswered = true;
      const idx = parseInt(btn.dataset.idx);
      const correct = idx === q.answer;
      if (correct) state.quizScore++;

      document.querySelectorAll('.quiz-option').forEach((b, i) => {
        b.disabled = true;
        if (i === q.answer) b.classList.add('correct');
        else if (i === idx && !correct) b.classList.add('wrong');
      });

      const fb = document.getElementById('quizFeedback');
      fb.innerHTML = `<div class="quiz-feedback ${correct ? 'ok' : 'no'}">
        ${correct ? '✅ 정답입니다!' : '❌ 오답입니다. 정답: ' + q.options[q.answer]}
      </div>
      <button class="btn btn-primary" id="nextQuizBtn" style="width:100%; margin-top:10px;">
        ${state.quizIndex + 1 >= quizzes.length ? '결과 보기' : '다음 문제'}
      </button>`;

      document.getElementById('nextQuizBtn').addEventListener('click', () => {
        state.quizAnswered = false;
        if (state.quizIndex + 1 >= quizzes.length) {
          state.quizDone = true;
          markVisited(state.catId, 'quiz');
        } else {
          state.quizIndex++;
        }
        renderMain();
      });
    });
  });
}

// ============================================================
// Init
// ============================================================
renderCategorySelect();
renderExampleSelect();
renderGate();
renderMain();
updateLangButtons();
</script>
