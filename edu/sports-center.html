<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>복합스포츠센터 영어 안내 학습</title>
<style>
  :root {
    --court-green: #2F5D4F;
    --court-green-light: #3E7A68;
    --track-red: #C8442E;
    --wood-bg: #F2EDE3;
    --wood-bg-deep: #E7DFCD;
    --ink: #1F2B38;
    --gold: #E8B14A;
    --paper: #FBF8F1;
    --line: #D8CFB8;
    --radius: 14px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--wood-bg);
    color: var(--ink);
    font-family: 'Pretendard', 'Noto Sans KR', -apple-system, BlinkMacSystemFont, sans-serif;
    min-height: 100vh;
  }

  .app {
    max-width: 480px;
    margin: 0 auto;
    min-height: 100vh;
    background: var(--paper);
    box-shadow: 0 0 40px rgba(31,43,56,0.08);
    display: flex;
    flex-direction: column;
  }

  /* ---------- Header ---------- */
  header {
    background: var(--court-green);
    color: var(--paper);
    padding: 20px 20px 16px;
    position: relative;
    overflow: hidden;
  }
  header::after {
    content: "";
    position: absolute;
    right: -20px; top: -20px;
    width: 90px; height: 90px;
    background: var(--court-green-light);
    border-radius: 50%;
    opacity: 0.45;
    z-index: 0;
  }
  .header-inner { position: relative; z-index: 1; }
  .brand-eyebrow {
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--gold);
    font-weight: 700;
    margin-bottom: 4px;
  }
  .brand-title {
    font-size: 21px;
    font-weight: 800;
    letter-spacing: -0.01em;
    line-height: 1.3;
  }
  .brand-sub {
    font-size: 12.5px;
    opacity: 0.85;
    margin-top: 4px;
  }

  /* Gate progress */
  .gate {
    display: grid;
    grid-template-columns: repeat(17, 1fr);
    gap: 3px;
    margin-top: 14px;
    position: relative;
    z-index: 1;
  }
  .gate-stamp {
    height: 6px;
    border-radius: 3px;
    background: rgba(255,255,255,0.22);
    overflow: hidden;
  }
  .gate-stamp i {
    display: block;
    height: 100%;
    width: 0%;
    background: var(--gold);
    border-radius: 3px;
    transition: width 0.4s ease;
  }
  .gate-label {
    font-size: 11px;
    color: rgba(255,255,255,0.75);
    margin-top: 6px;
    font-weight: 600;
  }

  /* ---------- Dropdown selector area ---------- */
  .selector-panel {
    background: var(--wood-bg-deep);
    border-bottom: 1px solid var(--line);
    padding: 14px 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .select-row {
    display: flex;
    flex-direction: column;
    gap: 5px;
  }
  .select-label {
    font-size: 11px;
    font-weight: 700;
    color: var(--court-green);
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }
  .select-wrap {
    position: relative;
  }
  select.cat-select, select.ex-select {
    width: 100%;
    appearance: none;
    -webkit-appearance: none;
    background: var(--paper);
    border: 1.5px solid var(--line);
    border-radius: 10px;
    padding: 12px 38px 12px 14px;
    font-size: 14.5px;
    font-weight: 700;
    color: var(--ink);
    cursor: pointer;
    font-family: inherit;
  }
  select.cat-select:focus, select.ex-select:focus {
    outline: 2px solid var(--court-green);
    outline-offset: 1px;
  }
  .select-wrap::after {
    content: "▾";
    position: absolute;
    right: 14px; top: 50%;
    transform: translateY(-50%);
    color: var(--track-red);
    font-size: 14px;
    pointer-events: none;
    font-weight: 800;
  }

  /* ---------- Tabs ---------- */
  .tabs {
    display: flex;
    border-bottom: 2px solid var(--line);
    background: var(--paper);
  }
  .tab {
    flex: 1;
    text-align: center;
    padding: 13px 4px;
    font-size: 13px;
    font-weight: 700;
    color: #8B8474;
    cursor: pointer;
    border-bottom: 3px solid transparent;
    transition: all 0.15s ease;
  }
  .tab.active {
    color: var(--court-green);
    border-bottom-color: var(--court-green);
  }

  main {
    flex: 1;
    padding: 18px 16px 28px;
  }

  .section-title {
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--court-green);
    margin: 0 0 12px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .section-title::before {
    content: "";
    width: 4px; height: 14px;
    background: var(--track-red);
    border-radius: 2px;
  }

  /* ---------- Vocab cards ---------- */
  .vocab-card {
    background: white;
    border: 1.5px solid var(--line);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .vocab-en {
    font-size: 18px;
    font-weight: 800;
    color: var(--ink);
  }
  .vocab-pron {
    font-size: 12px;
    color: var(--track-red);
    font-weight: 600;
    margin-top: 2px;
  }
  .vocab-ko {
    font-size: 13px;
    color: #6B6457;
    margin-top: 4px;
  }
  .play-btn {
    flex: 0 0 auto;
    width: 42px; height: 42px;
    border-radius: 50%;
    background: var(--court-green);
    color: white;
    border: none;
    font-size: 16px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .play-btn:active { transform: scale(0.92); }
  .play-btn.playing { background: var(--gold); color: var(--ink); }

  /* ---------- Pronunciation tab ---------- */
  .pron-card {
    background: white;
    border: 1.5px solid var(--line);
    border-radius: var(--radius);
    padding: 22px 18px;
    text-align: center;
    margin-bottom: 14px;
  }
  .pron-en { font-size: 24px; font-weight: 800; margin-bottom: 6px; }
  .pron-kr { font-size: 15px; color: var(--track-red); font-weight: 700; margin-bottom: 4px; }
  .pron-ko { font-size: 13px; color: #6B6457; margin-bottom: 16px; }
  .pron-controls { display: flex; gap: 10px; justify-content: center; }
  .btn {
    border: none;
    border-radius: 10px;
    padding: 11px 18px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
  }
  .btn-primary { background: var(--court-green); color: white; }
  .btn-secondary { background: var(--wood-bg-deep); color: var(--ink); }
  .btn-nav {
    background: var(--paper);
    color: var(--ink);
    border: 1.5px solid var(--line);
    width: 44px; height: 44px;
    border-radius: 50%;
    font-size: 16px;
  }
  .pron-nav-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }
  .pron-counter {
    text-align: center;
    font-size: 12px;
    color: #8B8474;
    margin-top: 10px;
    font-weight: 600;
  }

  /* ---------- Dialogue tab ---------- */
  .dialogue-row { display: flex; margin-bottom: 10px; }
  .dialogue-row.visitor { justify-content: flex-start; }
  .dialogue-row.staff { justify-content: flex-end; }
  .bubble {
    max-width: 82%;
    border-radius: var(--radius);
    padding: 12px 14px;
    position: relative;
  }
  .dialogue-row.visitor .bubble {
    background: white;
    border: 1.5px solid var(--line);
    border-top-left-radius: 4px;
  }
  .dialogue-row.staff .bubble {
    background: var(--court-green);
    color: white;
    border-top-right-radius: 4px;
  }
  .bubble-tag {
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 4px;
    opacity: 0.65;
  }
  .bubble-en { font-size: 15px; font-weight: 700; line-height: 1.4; }
  .bubble-ko { font-size: 12.5px; margin-top: 4px; opacity: 0.85; }
  .bubble-pron { font-size: 12px; margin-top: 2px; opacity: 0.7; letter-spacing: 0.02em; }
  .bubble-play {
    border: none;
    background: rgba(0,0,0,0.08);
    border-radius: 50%;
    width: 26px; height: 26px;
    font-size: 11px;
    margin-top: 8px;
    cursor: pointer;
    color: inherit;
  }
  .dialogue-row.staff .bubble-play { background: rgba(255,255,255,0.2); }

  .dialogue-actions { display: flex; gap: 10px; margin-top: 16px; }
  .dialogue-actions .btn { flex: 1; }

  .ex-nav-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-top: 16px;
  }
  .ex-counter { font-size: 12px; color: #8B8474; font-weight: 600; }

  /* ---------- Quiz tab ---------- */
  .quiz-progress { font-size: 12px; font-weight: 700; color: #8B8474; margin-bottom: 6px; }
.quiz-progress-bar-wrap {
  height: 6px;
  background: #e9ecef;
  border-radius: 3px;
  margin: 4px 0 12px;
  overflow: hidden;
}
.quiz-progress-bar {
  height: 100%;
  background: linear-gradient(90deg, #4CAF50, #2196F3);
  border-radius: 3px;
  transition: width 0.3s ease;
}

  .quiz-card {
    background: white;
    border: 1.5px solid var(--line);
    border-radius: var(--radius);
    padding: 20px 18px;
    margin-bottom: 14px;
  }
  .quiz-type-tag {
    display: inline-block;
    font-size: 10px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    padding: 3px 9px;
    border-radius: 999px;
    margin-bottom: 10px;
  }
  .quiz-type-tag.choice { background: #E8F0EC; color: var(--court-green); }
  .quiz-type-tag.listen { background: #FBE8E2; color: var(--track-red); }
  .quiz-question { font-size: 16px; font-weight: 800; margin-bottom: 14px; line-height: 1.4; }
  .quiz-listen-btn {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--wood-bg-deep);
    border: none;
    border-radius: 10px;
    padding: 12px 16px;
    font-size: 13px;
    font-weight: 700;
    color: var(--ink);
    cursor: pointer;
    margin-bottom: 14px;
    width: 100%;
  }
  .quiz-option {
    display: block;
    width: 100%;
    text-align: left;
    background: var(--paper);
    border: 1.5px solid var(--line);
    border-radius: 10px;
    padding: 12px 14px;
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 8px;
    cursor: pointer;
  }
  .quiz-option:hover { border-color: var(--court-green); }
  .quiz-option.correct { background: #E8F0EC; border-color: var(--court-green); color: var(--court-green); }
  .quiz-option.wrong { background: #FBE2DC; border-color: var(--track-red); color: var(--track-red); }
  .quiz-option:disabled { cursor: default; }

  .quiz-feedback { font-size: 13px; font-weight: 700; margin-top: 4px; padding: 10px 12px; border-radius: 8px; }
  .quiz-feedback.ok { background: #E8F0EC; color: var(--court-green); }
  .quiz-feedback.no { background: #FBE2DC; color: var(--track-red); }

  .quiz-result { text-align: center; padding: 30px 16px; }
  .quiz-result .score { font-size: 42px; font-weight: 800; color: var(--court-green); }
  .quiz-progress-bar-wrap {
  height: 6px;
  background: #e9ecef;
  border-radius: 3px;
  margin: 6px 0 12px;
  overflow: hidden;
}
.quiz-progress-bar {
  height: 100%;
  background: linear-gradient(90deg, #4CAF50, #2196F3);
  border-radius: 3px;
  transition: width 0.3s ease;
}
.quiz-result .score-label { font-size: 13px; color: #8B8474; font-weight: 600; margin-top: 4px; }

  .hidden { display: none !important; }

  footer {
    text-align: center;
    font-size: 11px;
    color: #B0A98F;
    padding: 14px;
    border-top: 1px solid var(--line);
  }
  .lang-toggle {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin-bottom: 12px;
  }
  .lang-btn {
    padding: 7px 16px;
    border-radius: 20px;
    border: 2px solid rgba(255,255,255,0.3);
    background: rgba(255,255,255,0.08);
    color: rgba(255,255,255,0.7);
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .lang-btn:hover {
    background: rgba(255,255,255,0.15);
  }
  .lang-btn.lang-active {
    background: #FFFFFF;
    color: #2F5D4F;
    border-color: #FFFFFF;
  }
</style>
</head>
<body>
<div class="app">

  <header>
    <div class="header-inner">
      <div class="lang-toggle">
        <button class="lang-btn" id="langEnBtn" onclick="setLanguage('en')">🇺🇸 English</button>
        <button class="lang-btn" id="langJaBtn" onclick="setLanguage('ja')">🇯🇵 日本語</button>
      </div>
      <div class="brand-eyebrow">ASAN SPORTS CENTER STAFF</div>
      <div class="brand-title">복합스포츠센터<br>외국인 응대 학습</div>
      <div class="brand-sub">외국인 방문객을 위한 짧고 쉬운 표현</div>
      <div class="gate" id="gateProgress"></div>
      <div class="gate-label" id="gateLabel"></div>
    </div>
  </header>

  <div class="selector-panel">
    <div class="select-row">
      <div class="select-label">📂 상황 선택 (총 17가지)</div>
      <div class="select-wrap">
        <select class="cat-select" id="catSelect"></select>
      </div>
    </div>
    <div class="select-row">
      <div class="select-label">🔢 예제 선택</div>
      <div class="select-wrap">
        <select class="ex-select" id="exSelect"></select>
      </div>
    </div>
  </div>

  <div class="tabs">
    <div class="tab active" data-tab="vocab">단어</div>
    <div class="tab" data-tab="pron">발음</div>
    <div class="tab" data-tab="dialogue">대화</div>
    <div class="tab" data-tab="quiz">퀴즈</div>
  </div>

  <main id="mainContent"></main>

  <footer>SsongT @ Dongil IT DEPT</footer>
</div>

<script>
// ============================================================

    "dial": {"hours": [[{"speaker": "visitor", "en": "Hi. What time do you open?", "ko": "안녕하세요. 몇 시에 여나요?"}, {"speaker": "staff", "en": "We open at 6 AM.", "ko": "오전 6시에 엽니다."}, {"speaker": "visitor", "en": "And what time do you close?", "ko": "그럼 몇 시에 닫나요?"}, {"speaker": "staff", "en": "We close at 10 PM.", "ko": "밤 10시에 닫습니다."}], [{"speaker": "visitor", "en": "Are you open every day?", "ko": "매일 여나요?"}, {"speaker": "staff", "en": "No. We are closed on Mondays.", "ko": "아니요. 월요일은 쉽니다."}, {"speaker": "visitor", "en": "Every Monday?", "ko": "매주 월요일이요?"}, {"speaker": "staff", "en": "Yes, every Monday. Sorry.", "ko": "네, 매주 월요일이요. 죄송합니다."}], [{"speaker": "visitor", "en": "What about public holidays?", "ko": "공휴일은 어떤가요?"}, {"speaker": "staff", "en": "We are closed on public holidays too.", "ko": "공휴일도 쉽니다."}, {"speaker": "visitor", "en": "Oh, I see. So Mondays and holidays.", "ko": "아, 그렇군요. 월요일과 공휴일이군요."}, {"speaker": "staff", "en": "Yes, that's right.", "ko": "네, 맞습니다."}], [{"speaker": "visitor", "en": "What time do you close today?", "ko": "오늘은 몇 시에 닫나요?"}, {"speaker": "staff", "en": "We close at 10 PM today.", "ko": "오늘은 밤 10시에 닫습니다."}, {"speaker": "visitor", "en": "So I still have two hours?", "ko": "그럼 두 시간 더 있나요?"}, {"speaker": "staff", "en": "Yes. Please enjoy your time.", "ko": "네. 즐거운 시간 되세요."}], [{"speaker": "visitor", "en": "Are you open on weekends?", "ko": "주말에도 여나요?"}, {"speaker": "staff", "en": "Yes. We are open on Saturday and Sunday.", "ko": "네. 토요일과 일요일에도 엽니다."}, {"speaker": "visitor", "en": "Same time as weekdays?", "ko": "평일과 시간이 같나요?"}, {"speaker": "staff", "en": "Yes. 6 AM to 10 PM. Same time.", "ko": "네. 오전 6시부터 밤 10시까지. 같습니다."}], [{"speaker": "visitor", "en": "Are the hours different on weekends?", "ko": "주말에는 시간이 다른가요?"}, {"speaker": "staff", "en": "No. The hours are the same every day.", "ko": "아니요. 매일 시간이 같습니다."}, {"speaker": "visitor", "en": "Good. So 6 to 10, right?", "ko": "좋네요. 그래서 6시부터 10시까지요?"}, {"speaker": "staff", "en": "Yes. 6 AM to 10 PM. Closed on Mondays.", "ko": "네. 오전 6시부터 밤 10시까지. 월요일은 쉽니다."}], [{"speaker": "visitor", "en": "Tomorrow is a holiday. Are you open?", "ko": "내일이 공휴일인데, 여나요?"}, {"speaker": "staff", "en": "No. We are closed tomorrow.", "ko": "아니요. 내일은 휴관입니다."}, {"speaker": "visitor", "en": "When can I come back?", "ko": "언제 다시 오면 되나요?"}, {"speaker": "staff", "en": "The day after tomorrow. 6 AM to 10 PM.", "ko": "모레요. 오전 6시부터 밤 10시까지입니다."}], [{"speaker": "visitor", "en": "When is the last entry?", "ko": "마지막 입장은 언제인가요?"}, {"speaker": "staff", "en": "Last entry is 9:30 PM.", "ko": "마지막 입장은 밤 9시 30분입니다."}, {"speaker": "visitor", "en": "So 30 minutes before closing?", "ko": "그럼 닫기 30분 전인가요?"}, {"speaker": "staff", "en": "Yes. We close at 10 PM.", "ko": "네. 밤 10시에 닫습니다."}], [{"speaker": "visitor", "en": "Do you close for lunch?", "ko": "점심시간에 닫나요?"}, {"speaker": "staff", "en": "No. We are open all day.", "ko": "아니요. 하루 종일 엽니다."}, {"speaker": "visitor", "en": "From 6 AM to 10 PM?", "ko": "오전 6시부터 밤 10시까지요?"}, {"speaker": "staff", "en": "Yes. No lunch break.", "ko": "네. 점심 휴게시간은 없습니다."}], [{"speaker": "visitor", "en": "Can I come on Monday?", "ko": "월요일에 와도 되나요?"}, {"speaker": "staff", "en": "Sorry. Closed on Mondays.", "ko": "죄송합니다. 월요일은 쉽니다."}, {"speaker": "visitor", "en": "Then when should I come?", "ko": "그럼 언제 와야 하나요?"}, {"speaker": "staff", "en": "Please come Tuesday to Sunday. 6 AM to 10 PM.", "ko": "화요일부터 일요일까지 오세요. 오전 6시부터 밤 10시까지입니다."}]], "location": [[{"speaker": "visitor", "en": "Where is the table tennis room?", "ko": "탁구장이 어디인가요?"}, {"speaker": "staff", "en": "It is on the first floor.", "ko": "1층에 있습니다."}, {"speaker": "visitor", "en": "Is it near here?", "ko": "여기서 가깝나요?"}, {"speaker": "staff", "en": "Yes. Just go straight. It is right there.", "ko": "네. 똑바로 가세요. 바로 저기예요."}], [{"speaker": "visitor", "en": "Where is the badminton court?", "ko": "배드민턴장이 어디인가요?"}, {"speaker": "staff", "en": "It is on the second floor.", "ko": "2층에 있습니다."}, {"speaker": "visitor", "en": "How do I go up?", "ko": "어떻게 올라가나요?"}, {"speaker": "staff", "en": "The elevator is over there. Or you can take the stairs.", "ko": "엘리베이터는 저쪽에 있어요. 계단도 있습니다."}], [{"speaker": "visitor", "en": "I am looking for the squash court.", "ko": "스쿼시장을 찾고 있어요."}, {"speaker": "staff", "en": "It is on the first floor, next to the table tennis room.", "ko": "1층, 탁구장 옆에 있습니다."}, {"speaker": "visitor", "en": "Same floor as table tennis?", "ko": "탁구장과 같은 층인가요?"}, {"speaker": "staff", "en": "Yes. Both are on the first floor.", "ko": "네. 둘 다 1층에 있어요."}], [{"speaker": "visitor", "en": "Where is the main stadium?", "ko": "주경기장이 어디인가요?"}, {"speaker": "staff", "en": "Please go outside and walk straight up.", "ko": "밖으로 나가서 위쪽으로 똑바로 걸어가세요."}, {"speaker": "visitor", "en": "How far is it?", "ko": "얼마나 멀어요?"}, {"speaker": "staff", "en": "About 150 meters. You will see a big building.", "ko": "약 150미터요. 큰 건물이 보일 거예요."}], [{"speaker": "visitor", "en": "Where can I play basketball?", "ko": "농구는 어디서 할 수 있나요?"}, {"speaker": "staff", "en": "On the second floor. Same place as badminton.", "ko": "2층이요. 배드민턴장과 같은 곳입니다."}, {"speaker": "visitor", "en": "How about volleyball?", "ko": "배구는요?"}, {"speaker": "staff", "en": "Also on the second floor. Same court.", "ko": "그것도 2층이에요. 같은 코트입니다."}], [{"speaker": "visitor", "en": "Where is the information desk?", "ko": "안내 데스크가 어디인가요?"}, {"speaker": "staff", "en": "It is right here, on the first floor.", "ko": "여기 1층에 있습니다."}, {"speaker": "visitor", "en": "Is there one in the stadium too?", "ko": "경기장에도 있나요?"}, {"speaker": "staff", "en": "Yes. On the first floor of the main stadium.", "ko": "네. 주경기장 1층에 있어요."}], [{"speaker": "visitor", "en": "Where is the elevator?", "ko": "엘리베이터는 어디인가요?"}, {"speaker": "staff", "en": "It is right behind you.", "ko": "바로 뒤에 있습니다."}, {"speaker": "visitor", "en": "Can I use it to go to the second floor?", "ko": "2층으로 갈 때 쓸 수 있나요?"}, {"speaker": "staff", "en": "Yes. Just press the second-floor button.", "ko": "네. 2층 버튼만 누르세요."}], [{"speaker": "visitor", "en": "Where can I watch the game?", "ko": "경기를 어디서 볼 수 있나요?"}, {"speaker": "staff", "en": "We have 202 seats on the second floor.", "ko": "2층에 202석의 관람석이 있습니다."}, {"speaker": "visitor", "en": "My friend uses a wheelchair.", "ko": "제 친구가 휠체어를 사용해요."}, {"speaker": "staff", "en": "No problem. We have 3 accessible seats.", "ko": "괜찮습니다. 장애인석 3석이 있어요."}], [{"speaker": "visitor", "en": "Where is the ice rink? Can you tell me how to get there?", "ko": "빙상장이 어디인가요? 가는 방법을 알려주시겠어요?"}, {"speaker": "staff", "en": "Sure. Go out the main entrance and turn right. There is a sidewalk.", "ko": "네. 정문으로 나가서 오른쪽으로 가세요. 인도가 있어요."}, {"speaker": "visitor", "en": "Okay. Then what?", "ko": "네. 그 다음에는요?"}, {"speaker": "staff", "en": "Walk about 150 meters. You will see a big building on your left, next to Parking Lot 14. That is the ice rink.", "ko": "150미터 정도 걸어가세요. 왼편에 큰 건물이 보이는데, 14번 주차장 옆이에요. 그게 빙상장이에요."}], [{"speaker": "visitor", "en": "Is there another way to the ice rink?", "ko": "빙상장으로 가는 다른 길도 있나요?"}, {"speaker": "staff", "en": "Yes. You can also go out to our parking lot.", "ko": "네. 저희 주차장으로 나가셔도 됩니다."}, {"speaker": "visitor", "en": "And then?", "ko": "그 다음은요?"}, {"speaker": "staff", "en": "Walk diagonally across the parking lot to the end. You will find some stairs. Go up two flights, and the ice rink building is right across from you.", "ko": "주차장을 대각선으로 끝까지 가로질러 가세요. 계단이 보일 거예요. 두 층을 올라가시면, 맞은편에 빙상장 건물이 있어요."}]], "rental": [[{"speaker": "visitor", "en": "I want to rent a court for my club.", "ko": "동호회 때문에 코트를 대관하고 싶어요."}, {"speaker": "staff", "en": "Sure. Which court do you need?", "ko": "네. 어떤 코트가 필요하세요?"}, {"speaker": "visitor", "en": "The badminton court, please.", "ko": "배드민턴 코트요."}, {"speaker": "staff", "en": "Okay. Please apply 20 days before.", "ko": "네. 20일 전에 신청해 주세요."}], [{"speaker": "visitor", "en": "When do I need to apply?", "ko": "언제까지 신청해야 하나요?"}, {"speaker": "staff", "en": "At least 20 days before your use date.", "ko": "이용일 최소 20일 전에요."}, {"speaker": "visitor", "en": "20 days? That's a long time.", "ko": "20일이요? 좀 기네요."}, {"speaker": "staff", "en": "Yes. It is our rule for all facilities.", "ko": "네. 모든 시설에 적용되는 규칙입니다."}], [{"speaker": "visitor", "en": "Can I book online?", "ko": "온라인으로 예약할 수 있나요?"}, {"speaker": "staff", "en": "Sorry, not online. You can visit or send a fax.", "ko": "죄송합니다, 온라인은 안 돼요. 방문이나 팩스로 가능합니다."}, {"speaker": "visitor", "en": "What is the fax number?", "ko": "팩스 번호가 뭔가요?"}, {"speaker": "staff", "en": "041-540-2138.", "ko": "041-540-2138입니다."}], [{"speaker": "visitor", "en": "Can foreigners rent the court?", "ko": "외국인도 코트를 대관할 수 있나요?"}, {"speaker": "staff", "en": "Rentals are for Asan residents or local groups.", "ko": "대관은 아산시민이나 관내 단체 대상입니다."}, {"speaker": "visitor", "en": "I live in Asan. Is that okay?", "ko": "저 아산에 살아요. 괜찮나요?"}, {"speaker": "staff", "en": "Yes, that's fine. Please bring your ID.", "ko": "네, 괜찮습니다. 신분증을 가져오세요."}], [{"speaker": "visitor", "en": "How much is the badminton court?", "ko": "배드민턴 코트는 얼마인가요?"}, {"speaker": "staff", "en": "20,000 won for 2 hours on weekdays.", "ko": "평일 2시간에 2만 원입니다."}, {"speaker": "visitor", "en": "And on weekends?", "ko": "주말은요?"}, {"speaker": "staff", "en": "25,000 won for 2 hours on weekends.", "ko": "주말 2시간에 2만 5천 원입니다."}], [{"speaker": "visitor", "en": "How much for the basketball court?", "ko": "농구 코트는 얼마예요?"}, {"speaker": "staff", "en": "40,000 won for 2 hours on weekdays.", "ko": "평일 2시간에 4만 원입니다."}, {"speaker": "visitor", "en": "What about volleyball?", "ko": "배구는요?"}, {"speaker": "staff", "en": "Same price. Same court.", "ko": "같은 가격이에요. 같은 코트입니다."}], [{"speaker": "visitor", "en": "Is air conditioning included?", "ko": "냉방이 포함되어 있나요?"}, {"speaker": "staff", "en": "No. There is an extra fee.", "ko": "아니요. 추가 요금이 있어요."}, {"speaker": "visitor", "en": "How much extra?", "ko": "얼마나 추가되나요?"}, {"speaker": "staff", "en": "30,000 won, plus the actual gas and electricity used.", "ko": "3만 원, 그리고 실제 사용한 가스와 전기료입니다."}], [{"speaker": "visitor", "en": "Do I need to fill out a form?", "ko": "신청서를 작성해야 하나요?"}, {"speaker": "staff", "en": "Yes. Please fill out this application form.", "ko": "네. 이 신청서를 작성해 주세요."}, {"speaker": "visitor", "en": "Is it in English?", "ko": "영어로 되어 있나요?"}, {"speaker": "staff", "en": "Only in Korean. I will help you.", "ko": "한국어만 있어요. 제가 도와드릴게요."}], [{"speaker": "visitor", "en": "How long can I rent for?", "ko": "얼마나 오래 빌릴 수 있나요?"}, {"speaker": "staff", "en": "Our basic unit is 2 hours.", "ko": "기본 단위는 2시간입니다."}, {"speaker": "visitor", "en": "Can I rent for 4 hours?", "ko": "4시간 빌릴 수 있나요?"}, {"speaker": "staff", "en": "Yes. Two blocks of 2 hours. Please book early.", "ko": "네. 2시간씩 두 블록이요. 미리 신청해 주세요."}], [{"speaker": "visitor", "en": "I have more questions. Who can I call?", "ko": "질문이 더 있어요. 누구에게 전화해야 하나요?"}, {"speaker": "staff", "en": "Please call the Sports Division.", "ko": "체육진흥과로 전화해 주세요."}, {"speaker": "visitor", "en": "What is the number?", "ko": "번호가 뭔가요?"}, {"speaker": "staff", "en": "041-536-8531. They speak Korean.", "ko": "041-536-8531입니다. 한국어로 응대합니다."}]], "ice": [[{"speaker": "visitor", "en": "How much is the entry fee?", "ko": "입장료가 얼마인가요?"}, {"speaker": "staff", "en": "3,000 won for adults.", "ko": "성인은 3,000원입니다."}, {"speaker": "visitor", "en": "Do I pay here?", "ko": "여기서 내나요?"}, {"speaker": "staff", "en": "Yes. Cash or card is fine.", "ko": "네. 현금이나 카드 둘 다 됩니다."}], [{"speaker": "visitor", "en": "I don't have skates. Can I rent them?", "ko": "스케이트가 없어요. 대여할 수 있나요?"}, {"speaker": "staff", "en": "Yes. Skate rental is 2,500 won.", "ko": "네. 스케이트 대여는 2,500원입니다."}, {"speaker": "visitor", "en": "Do you have my size?", "ko": "제 사이즈가 있나요?"}, {"speaker": "staff", "en": "What size do you wear?", "ko": "어떤 사이즈를 신으세요?"}], [{"speaker": "visitor", "en": "What do I need to wear?", "ko": "어떤 옷을 입어야 하나요?"}, {"speaker": "staff", "en": "Gloves, long sleeves, and long pants.", "ko": "장갑, 긴팔, 긴바지입니다."}, {"speaker": "visitor", "en": "Is it required?", "ko": "필수인가요?"}, {"speaker": "staff", "en": "Yes. It is for your safety.", "ko": "네. 안전을 위해서입니다."}], [{"speaker": "visitor", "en": "I don't have gloves.", "ko": "장갑이 없어요."}, {"speaker": "staff", "en": "You can buy them here. 5,000 won.", "ko": "여기서 살 수 있어요. 5,000원입니다."}, {"speaker": "visitor", "en": "Okay. One pair, please.", "ko": "네. 한 켤레 주세요."}, {"speaker": "staff", "en": "Here you are. Please put them on now.", "ko": "여기 있습니다. 지금 끼워 주세요."}], [{"speaker": "visitor", "en": "Why is everyone leaving the ice?", "ko": "왜 다들 빙판에서 나오나요?"}, {"speaker": "staff", "en": "It is ice cleaning time.", "ko": "정빙 시간이에요."}, {"speaker": "visitor", "en": "How long does it take?", "ko": "얼마나 걸리나요?"}, {"speaker": "staff", "en": "15 minutes. Please wait outside the rink.", "ko": "15분이요. 빙판 밖에서 기다려 주세요."}], [{"speaker": "visitor", "en": "How often is the ice cleaning?", "ko": "정빙은 얼마나 자주 하나요?"}, {"speaker": "staff", "en": "Every 45 minutes.", "ko": "45분마다입니다."}, {"speaker": "visitor", "en": "So 45 minutes skating, 15 minutes break?", "ko": "45분 스케이팅, 15분 휴식인가요?"}, {"speaker": "staff", "en": "Yes. That is the pattern.", "ko": "네. 그렇게 진행됩니다."}], [{"speaker": "visitor", "en": "It's my first time skating.", "ko": "스케이트는 처음이에요."}, {"speaker": "staff", "en": "No problem. Please be careful.", "ko": "괜찮습니다. 조심하세요."}, {"speaker": "visitor", "en": "Is there a beginner area?", "ko": "초보자 구역이 있나요?"}, {"speaker": "staff", "en": "Yes. Please skate near the wall first.", "ko": "네. 처음에는 벽 근처에서 타세요."}], [{"speaker": "visitor", "en": "Is the ice rink open on Mondays?", "ko": "빙상장은 월요일에 여나요?"}, {"speaker": "staff", "en": "Sorry. We are closed on Mondays.", "ko": "죄송합니다. 월요일은 쉽니다."}, {"speaker": "visitor", "en": "When can I come?", "ko": "언제 올 수 있나요?"}, {"speaker": "staff", "en": "Tuesday to Sunday. Please check the time on our notice.", "ko": "화요일부터 일요일까지요. 안내문에서 시간을 확인해 주세요."}], [{"speaker": "visitor", "en": "Do I need a helmet?", "ko": "헬멧이 필요한가요?"}, {"speaker": "staff", "en": "Not required, but recommended.", "ko": "필수는 아니지만 권장합니다."}, {"speaker": "visitor", "en": "Can I rent one?", "ko": "빌릴 수 있나요?"}, {"speaker": "staff", "en": "Yes. Please ask at the rental counter.", "ko": "네. 대여 카운터에 문의해 주세요."}], [{"speaker": "visitor", "en": "My child wants to skate too.", "ko": "아이도 스케이트를 타고 싶어해요."}, {"speaker": "staff", "en": "How old is your child?", "ko": "아이가 몇 살인가요?"}, {"speaker": "visitor", "en": "Seven years old.", "ko": "7살이에요."}, {"speaker": "staff", "en": "Okay. Please stay close to your child on the ice.", "ko": "네. 빙판에서 아이 옆에 꼭 붙어 계세요."}]], "tabletennis": [[{"speaker": "visitor", "en": "Where is the table tennis room?", "ko": "탁구장이 어디인가요?"}, {"speaker": "staff", "en": "First floor. Right over there.", "ko": "1층입니다. 바로 저쪽이에요."}, {"speaker": "visitor", "en": "Same floor as here?", "ko": "여기랑 같은 층인가요?"}, {"speaker": "staff", "en": "Yes. Just walk straight.", "ko": "네. 똑바로 가시면 됩니다."}], [{"speaker": "visitor", "en": "What time is the table tennis room open?", "ko": "탁구장은 몇 시에 여나요?"}, {"speaker": "staff", "en": "6 AM to 10 PM.", "ko": "오전 6시부터 밤 10시까지요."}, {"speaker": "visitor", "en": "Every day?", "ko": "매일이요?"}, {"speaker": "staff", "en": "Closed on Mondays and holidays.", "ko": "월요일과 공휴일은 쉽니다."}], [{"speaker": "visitor", "en": "Can I play table tennis now?", "ko": "지금 탁구 칠 수 있나요?"}, {"speaker": "staff", "en": "Yes. The tables are open now.", "ko": "네. 지금 테이블 이용 가능합니다."}, {"speaker": "visitor", "en": "Do I need to book?", "ko": "예약해야 하나요?"}, {"speaker": "staff", "en": "No. Just go in and play.", "ko": "아니요. 들어가서 그냥 치시면 돼요."}], [{"speaker": "visitor", "en": "I don't have a paddle.", "ko": "라켓이 없어요."}, {"speaker": "staff", "en": "You can rent one inside.", "ko": "안에서 빌릴 수 있습니다."}, {"speaker": "visitor", "en": "How much is the rental?", "ko": "대여료가 얼마인가요?"}, {"speaker": "staff", "en": "Please ask the staff inside the room.", "ko": "안에 있는 직원에게 문의해 주세요."}], [{"speaker": "visitor", "en": "Do you have table tennis balls?", "ko": "탁구공이 있나요?"}, {"speaker": "staff", "en": "Yes. The staff inside will give you one.", "ko": "네. 안에 있는 직원이 드릴 거예요."}, {"speaker": "visitor", "en": "Free of charge?", "ko": "무료인가요?"}, {"speaker": "staff", "en": "Usually yes. Please ask them.", "ko": "보통은 무료예요. 그분께 물어보세요."}], [{"speaker": "visitor", "en": "Can I wear these shoes?", "ko": "이 신발 신어도 되나요?"}, {"speaker": "staff", "en": "Please change to indoor shoes.", "ko": "실내화로 갈아 신어 주세요."}, {"speaker": "visitor", "en": "I don't have indoor shoes.", "ko": "실내화가 없어요."}, {"speaker": "staff", "en": "Clean sneakers are also okay.", "ko": "깨끗한 운동화도 괜찮습니다."}], [{"speaker": "visitor", "en": "I want to play with my friend.", "ko": "친구랑 같이 치고 싶어요."}, {"speaker": "staff", "en": "No problem. Two people share one table.", "ko": "괜찮습니다. 한 테이블에 두 명입니다."}, {"speaker": "visitor", "en": "Can four people play?", "ko": "네 명이 칠 수 있나요?"}, {"speaker": "staff", "en": "Yes. Doubles is also fine.", "ko": "네. 복식도 가능합니다."}], [{"speaker": "visitor", "en": "Is there a time limit?", "ko": "시간 제한이 있나요?"}, {"speaker": "staff", "en": "When it is busy, please share with others.", "ko": "사람이 많을 때는 다른 분들과 양보해 주세요."}, {"speaker": "visitor", "en": "How about now? It looks empty.", "ko": "지금은요? 비어 보여요."}, {"speaker": "staff", "en": "Now is fine. Please enjoy.", "ko": "지금은 괜찮습니다. 즐기세요."}], [{"speaker": "visitor", "en": "How much does it cost to play?", "ko": "치는 데 얼마인가요?"}, {"speaker": "staff", "en": "Please ask at the table tennis room.", "ko": "탁구장에서 문의해 주세요."}, {"speaker": "visitor", "en": "You don't know the price?", "ko": "가격을 모르세요?"}, {"speaker": "staff", "en": "Sorry. The room has its own price list.", "ko": "죄송합니다. 그곳에 별도 요금표가 있어요."}], [{"speaker": "visitor", "en": "What is next to the table tennis room?", "ko": "탁구장 옆에는 뭐가 있나요?"}, {"speaker": "staff", "en": "The squash court is right next to it.", "ko": "스쿼시장이 바로 옆에 있습니다."}, {"speaker": "visitor", "en": "Both on the first floor?", "ko": "둘 다 1층이에요?"}, {"speaker": "staff", "en": "Yes. Both are on the first floor.", "ko": "네. 둘 다 1층입니다."}]], "squash": [[{"speaker": "visitor", "en": "Where is the squash court?", "ko": "스쿼시장이 어디인가요?"}, {"speaker": "staff", "en": "First floor, next to the table tennis room.", "ko": "1층, 탁구장 옆입니다."}, {"speaker": "visitor", "en": "Can I just walk over?", "ko": "그냥 걸어가면 되나요?"}, {"speaker": "staff", "en": "Yes. Go straight, then turn right.", "ko": "네. 똑바로 가서 오른쪽으로 도세요."}], [{"speaker": "visitor", "en": "What time is the squash court open?", "ko": "스쿼시장은 몇 시에 여나요?"}, {"speaker": "staff", "en": "6 AM to 10 PM. Same as the center.", "ko": "오전 6시부터 밤 10시까지요. 센터와 같습니다."}, {"speaker": "visitor", "en": "What about Mondays?", "ko": "월요일은요?"}, {"speaker": "staff", "en": "Closed on Mondays and public holidays.", "ko": "월요일과 공휴일은 휴관입니다."}], [{"speaker": "visitor", "en": "Do I need to book a court?", "ko": "코트를 예약해야 하나요?"}, {"speaker": "staff", "en": "It is better to book on busy days.", "ko": "붐비는 날은 예약하시는 게 좋아요."}, {"speaker": "visitor", "en": "How do I book?", "ko": "어떻게 예약하나요?"}, {"speaker": "staff", "en": "Please ask at the squash court itself.", "ko": "스쿼시장에서 직접 문의해 주세요."}], [{"speaker": "visitor", "en": "I don't have a racket.", "ko": "라켓이 없어요."}, {"speaker": "staff", "en": "You can rent one at the court.", "ko": "코트에서 빌릴 수 있어요."}, {"speaker": "visitor", "en": "Do they have balls too?", "ko": "공도 있나요?"}, {"speaker": "staff", "en": "Yes. Rackets and balls are both available.", "ko": "네. 라켓과 공 모두 있습니다."}], [{"speaker": "visitor", "en": "Do I need eye protection?", "ko": "보안경이 필요한가요?"}, {"speaker": "staff", "en": "It is a good idea, for safety.", "ko": "안전을 위해 좋습니다."}, {"speaker": "visitor", "en": "Where can I get one?", "ko": "어디서 구할 수 있나요?"}, {"speaker": "staff", "en": "Please ask the staff inside the court.", "ko": "코트 안 직원에게 문의해 주세요."}], [{"speaker": "visitor", "en": "I have never played squash.", "ko": "스쿼시를 한 번도 안 해봤어요."}, {"speaker": "staff", "en": "That's okay. The court is for everyone.", "ko": "괜찮습니다. 누구나 이용할 수 있어요."}, {"speaker": "visitor", "en": "Are there lessons?", "ko": "강습이 있나요?"}, {"speaker": "staff", "en": "Please ask the staff inside.", "ko": "안에 있는 직원에게 문의해 주세요."}], [{"speaker": "visitor", "en": "Can two people play together?", "ko": "두 명이 함께 칠 수 있나요?"}, {"speaker": "staff", "en": "Yes. Squash is for two players.", "ko": "네. 스쿼시는 2인 경기입니다."}, {"speaker": "visitor", "en": "Can four people play?", "ko": "네 명도 가능한가요?"}, {"speaker": "staff", "en": "Doubles is possible. Please check inside.", "ko": "복식도 가능해요. 안에서 확인해 주세요."}], [{"speaker": "visitor", "en": "Can I wear my running shoes?", "ko": "운동화 신어도 되나요?"}, {"speaker": "staff", "en": "Please use clean indoor shoes.", "ko": "깨끗한 실내용 신발로 신어 주세요."}, {"speaker": "visitor", "en": "Will outdoor shoes mark the floor?", "ko": "실외용 신발은 바닥에 자국이 남나요?"}, {"speaker": "staff", "en": "Yes. That is why we need indoor shoes.", "ko": "네. 그래서 실내화가 필요해요."}], [{"speaker": "visitor", "en": "Is there a locker room?", "ko": "탈의실이 있나요?"}, {"speaker": "staff", "en": "Yes. We have locker rooms and showers.", "ko": "네. 탈의실과 샤워장이 있습니다."}, {"speaker": "visitor", "en": "On the same floor?", "ko": "같은 층에 있나요?"}, {"speaker": "staff", "en": "Yes. The staff inside will guide you.", "ko": "네. 안에 있는 직원이 안내해 드릴 거예요."}], [{"speaker": "visitor", "en": "What sports can I do on this floor?", "ko": "이 층에서 어떤 운동을 할 수 있나요?"}, {"speaker": "staff", "en": "Table tennis and squash.", "ko": "탁구와 스쿼시입니다."}, {"speaker": "visitor", "en": "Anything else upstairs?", "ko": "위층에는 다른 게 있나요?"}, {"speaker": "staff", "en": "Yes. Badminton, basketball, and volleyball.", "ko": "네. 배드민턴, 농구, 배구가 있습니다."}]], "badminton": [[{"speaker": "visitor", "en": "Where can I play badminton?", "ko": "배드민턴은 어디서 할 수 있나요?"}, {"speaker": "staff", "en": "On the second floor.", "ko": "2층입니다."}, {"speaker": "visitor", "en": "How do I go up?", "ko": "어떻게 올라가나요?"}, {"speaker": "staff", "en": "Stairs or elevator. Both work.", "ko": "계단이나 엘리베이터요. 둘 다 됩니다."}], [{"speaker": "visitor", "en": "Can I just walk in and play?", "ko": "그냥 들어가서 쳐도 되나요?"}, {"speaker": "staff", "en": "For groups, you need to book in advance.", "ko": "단체는 사전 예약이 필요합니다."}, {"speaker": "visitor", "en": "I am just one person.", "ko": "저는 혼자예요."}, {"speaker": "staff", "en": "Please check the schedule upstairs.", "ko": "위층에서 스케줄을 확인해 주세요."}], [{"speaker": "visitor", "en": "When do I book for my club?", "ko": "동호회 예약은 언제 하나요?"}, {"speaker": "staff", "en": "20 days before your use date.", "ko": "이용일 20일 전입니다."}, {"speaker": "visitor", "en": "By visit or by fax?", "ko": "방문이나 팩스로요?"}, {"speaker": "staff", "en": "Either is fine. Fax is 041-540-2138.", "ko": "둘 다 됩니다. 팩스는 041-540-2138입니다."}], [{"speaker": "visitor", "en": "How much for 2 hours on a weekday?", "ko": "평일 2시간은 얼마인가요?"}, {"speaker": "staff", "en": "20,000 won in the daytime.", "ko": "주간은 2만 원입니다."}, {"speaker": "visitor", "en": "And in the evening?", "ko": "저녁은요?"}, {"speaker": "staff", "en": "25,000 won in the evening.", "ko": "저녁은 2만 5천 원입니다."}], [{"speaker": "visitor", "en": "How much on weekends?", "ko": "주말은 얼마인가요?"}, {"speaker": "staff", "en": "25,000 won in the daytime.", "ko": "주간 2만 5천 원입니다."}, {"speaker": "visitor", "en": "And at night?", "ko": "야간은요?"}, {"speaker": "staff", "en": "30,000 won at night.", "ko": "야간 3만 원입니다."}], [{"speaker": "visitor", "en": "Do you have rackets to rent?", "ko": "라켓을 빌릴 수 있나요?"}, {"speaker": "staff", "en": "Please ask upstairs at the gym.", "ko": "위층 체육관에 문의해 주세요."}, {"speaker": "visitor", "en": "Do I bring my own shuttlecocks?", "ko": "셔틀콕은 제가 가져와야 하나요?"}, {"speaker": "staff", "en": "Usually, yes. But please check upstairs.", "ko": "보통은 그렇습니다. 위층에서 확인해 주세요."}], [{"speaker": "visitor", "en": "How many courts do you have?", "ko": "코트가 몇 개 있나요?"}, {"speaker": "staff", "en": "Several courts in the gym upstairs.", "ko": "위층 체육관에 여러 개 있습니다."}, {"speaker": "visitor", "en": "Are they all for badminton?", "ko": "전부 배드민턴용인가요?"}, {"speaker": "staff", "en": "The gym is shared with basketball and volleyball.", "ko": "체육관은 농구, 배구와 함께 씁니다."}], [{"speaker": "visitor", "en": "Can I play if basketball is happening?", "ko": "농구하고 있을 때 칠 수 있나요?"}, {"speaker": "staff", "en": "Only one sport uses the gym at a time.", "ko": "한 번에 한 종목만 사용합니다."}, {"speaker": "visitor", "en": "How do I check what's on now?", "ko": "지금 뭐 하는지 어떻게 알 수 있나요?"}, {"speaker": "staff", "en": "Please check the schedule upstairs.", "ko": "위층에서 스케줄을 확인해 주세요."}], [{"speaker": "visitor", "en": "Is the gym hot in summer?", "ko": "여름에 체육관이 더운가요?"}, {"speaker": "staff", "en": "There is air conditioning. But it costs extra.", "ko": "에어컨이 있어요. 추가 요금이 있습니다."}, {"speaker": "visitor", "en": "How much extra?", "ko": "얼마나 추가되나요?"}, {"speaker": "staff", "en": "30,000 won plus actual usage.", "ko": "3만 원에 실제 사용량이 추가됩니다."}], [{"speaker": "visitor", "en": "Can I play on Monday morning?", "ko": "월요일 아침에 칠 수 있나요?"}, {"speaker": "staff", "en": "Sorry. We are closed on Mondays.", "ko": "죄송합니다. 월요일은 쉽니다."}, {"speaker": "visitor", "en": "How about Tuesday morning?", "ko": "화요일 아침은요?"}, {"speaker": "staff", "en": "Yes. Open from 6 AM. Welcome.", "ko": "네. 오전 6시부터 엽니다. 환영합니다."}]], "ballcourt": [[{"speaker": "visitor", "en": "Where is the basketball court?", "ko": "농구장이 어디인가요?"}, {"speaker": "staff", "en": "Second floor. The multi-purpose gym.", "ko": "2층, 다목적 체육관입니다."}, {"speaker": "visitor", "en": "Is volleyball there too?", "ko": "배구도 거기서 하나요?"}, {"speaker": "staff", "en": "Yes. Same gym, same court.", "ko": "네. 같은 체육관, 같은 코트입니다."}], [{"speaker": "visitor", "en": "Can my team practice here?", "ko": "저희 팀이 여기서 연습할 수 있나요?"}, {"speaker": "staff", "en": "Yes, but you need to rent the court.", "ko": "네, 하지만 코트를 대관해야 합니다."}, {"speaker": "visitor", "en": "How do I rent it?", "ko": "어떻게 대관하나요?"}, {"speaker": "staff", "en": "Apply 20 days before by visit or fax.", "ko": "20일 전에 방문 또는 팩스로 신청하세요."}], [{"speaker": "visitor", "en": "How much for the basketball court?", "ko": "농구장은 얼마인가요?"}, {"speaker": "staff", "en": "40,000 won for 2 hours on weekdays.", "ko": "평일 2시간에 4만 원입니다."}, {"speaker": "visitor", "en": "Is night time the same price?", "ko": "야간도 같은 가격인가요?"}, {"speaker": "staff", "en": "Night is 50,000 won on weekdays.", "ko": "평일 야간은 5만 원입니다."}], [{"speaker": "visitor", "en": "And on weekends?", "ko": "주말은요?"}, {"speaker": "staff", "en": "50,000 won in the daytime.", "ko": "주간 5만 원입니다."}, {"speaker": "visitor", "en": "Night on weekends?", "ko": "주말 야간은요?"}, {"speaker": "staff", "en": "60,000 won at night on weekends.", "ko": "주말 야간은 6만 원입니다."}], [{"speaker": "visitor", "en": "Is volleyball the same price?", "ko": "배구도 가격이 같나요?"}, {"speaker": "staff", "en": "Yes. Basketball and volleyball share the price.", "ko": "네. 농구와 배구는 가격이 같습니다."}, {"speaker": "visitor", "en": "Why the same?", "ko": "왜 같은가요?"}, {"speaker": "staff", "en": "Because they share one court.", "ko": "한 코트를 함께 쓰기 때문입니다."}], [{"speaker": "visitor", "en": "Can our family watch the game?", "ko": "가족들이 경기를 볼 수 있나요?"}, {"speaker": "staff", "en": "Yes. There are 202 seats upstairs.", "ko": "네. 위층에 202석이 있습니다."}, {"speaker": "visitor", "en": "Any seats for the disabled?", "ko": "장애인석도 있나요?"}, {"speaker": "staff", "en": "Yes. 3 accessible seats are included.", "ko": "네. 장애인석 3석이 포함됩니다."}], [{"speaker": "visitor", "en": "How many people can use the court?", "ko": "코트에 몇 명까지 들어가나요?"}, {"speaker": "staff", "en": "Basketball is usually 10. Volleyball is 12.", "ko": "농구는 보통 10명, 배구는 12명입니다."}, {"speaker": "visitor", "en": "Can spectators come inside too?", "ko": "관중도 안에 들어올 수 있나요?"}, {"speaker": "staff", "en": "Spectators sit upstairs in the seating area.", "ko": "관중은 위층 관람석에 앉습니다."}], [{"speaker": "visitor", "en": "Do you provide a basketball?", "ko": "농구공을 제공하나요?"}, {"speaker": "staff", "en": "Please bring your own.", "ko": "직접 가져와 주세요."}, {"speaker": "visitor", "en": "Can I rent one?", "ko": "빌릴 수 있나요?"}, {"speaker": "staff", "en": "Please ask at the gym upstairs.", "ko": "위층 체육관에 문의해 주세요."}], [{"speaker": "visitor", "en": "Can I wear my outdoor shoes?", "ko": "실외용 신발 신어도 되나요?"}, {"speaker": "staff", "en": "Please change to indoor sports shoes.", "ko": "실내용 운동화로 갈아 신어 주세요."}, {"speaker": "visitor", "en": "Where can I change?", "ko": "어디서 갈아 신나요?"}, {"speaker": "staff", "en": "The locker room is upstairs.", "ko": "탈의실은 위층에 있습니다."}], [{"speaker": "visitor", "en": "Is the gym open on Mondays?", "ko": "체육관은 월요일에 여나요?"}, {"speaker": "staff", "en": "No. Closed on Mondays and holidays.", "ko": "아니요. 월요일과 공휴일은 휴관입니다."}, {"speaker": "visitor", "en": "Same as the rest of the center?", "ko": "센터 전체와 같은가요?"}, {"speaker": "staff", "en": "Yes. All facilities close together.", "ko": "네. 모든 시설이 함께 쉽니다."}]], "lockerroom": [[{"speaker": "visitor", "en": "Where is the locker room?", "ko": "탈의실이 어디인가요?"}, {"speaker": "staff", "en": "It is on this floor. Right over there.", "ko": "이 층에 있어요. 바로 저쪽이에요."}, {"speaker": "visitor", "en": "Which way is the men's room?", "ko": "남자 탈의실은 어느 쪽인가요?"}, {"speaker": "staff", "en": "Men is on the left. Women is on the right.", "ko": "남자는 왼쪽, 여자는 오른쪽입니다."}], [{"speaker": "visitor", "en": "How do I use the locker?", "ko": "라커는 어떻게 쓰나요?"}, {"speaker": "staff", "en": "Put your things inside. Then close the door.", "ko": "물건을 넣고 문을 닫으세요."}, {"speaker": "visitor", "en": "Do I need a key?", "ko": "열쇠가 필요한가요?"}, {"speaker": "staff", "en": "Yes. The locker key is at the front desk.", "ko": "네. 라커 열쇠는 안내 데스크에 있습니다."}], [{"speaker": "visitor", "en": "Is the locker free?", "ko": "라커는 무료인가요?"}, {"speaker": "staff", "en": "Yes. It is free for visitors.", "ko": "네. 이용객에게 무료입니다."}, {"speaker": "visitor", "en": "For how long?", "ko": "얼마나 쓸 수 있나요?"}, {"speaker": "staff", "en": "While you are here today.", "ko": "오늘 머무시는 동안입니다."}], [{"speaker": "visitor", "en": "Is the locker safe?", "ko": "라커가 안전한가요?"}, {"speaker": "staff", "en": "Yes, but please don't leave valuables.", "ko": "네, 하지만 귀중품은 두지 마세요."}, {"speaker": "visitor", "en": "Where can I keep my wallet?", "ko": "지갑은 어디 둬야 하나요?"}, {"speaker": "staff", "en": "Please keep it with you.", "ko": "직접 가지고 계세요."}], [{"speaker": "visitor", "en": "I lost my locker key.", "ko": "라커 열쇠를 잃어버렸어요."}, {"speaker": "staff", "en": "I will help. What is your locker number?", "ko": "도와드릴게요. 라커 번호가 몇 번이세요?"}, {"speaker": "visitor", "en": "I don't remember.", "ko": "기억이 안 나요."}, {"speaker": "staff", "en": "Please come with me to the locker room.", "ko": "저와 함께 탈의실로 가시죠."}], [{"speaker": "visitor", "en": "Where can I change clothes?", "ko": "어디서 옷을 갈아입나요?"}, {"speaker": "staff", "en": "Inside the locker room. There are changing areas.", "ko": "탈의실 안이요. 탈의 공간이 있어요."}, {"speaker": "visitor", "en": "Is it open now?", "ko": "지금 열려 있나요?"}, {"speaker": "staff", "en": "Yes. Open from 6 AM to 10 PM.", "ko": "네. 오전 6시부터 밤 10시까지 엽니다."}], [{"speaker": "visitor", "en": "Can my son come with me to the locker room?", "ko": "아들을 탈의실에 데리고 가도 되나요?"}, {"speaker": "staff", "en": "How old is he?", "ko": "몇 살이세요?"}, {"speaker": "visitor", "en": "He is five.", "ko": "다섯 살이요."}, {"speaker": "staff", "en": "Yes. Young children can come with a parent.", "ko": "네. 어린아이는 부모와 함께 들어갈 수 있어요."}], [{"speaker": "visitor", "en": "Is the locker room clean?", "ko": "탈의실이 깨끗한가요?"}, {"speaker": "staff", "en": "Yes. We clean it every day.", "ko": "네. 매일 청소합니다."}, {"speaker": "visitor", "en": "Good to know. Thank you.", "ko": "다행이네요. 감사합니다."}, {"speaker": "staff", "en": "Please tell us if anything is dirty.", "ko": "더러우면 말씀해 주세요."}], [{"speaker": "visitor", "en": "Is there a hair dryer?", "ko": "헤어드라이어가 있나요?"}, {"speaker": "staff", "en": "Yes. Inside the locker room.", "ko": "네. 탈의실 안에 있습니다."}, {"speaker": "visitor", "en": "Free to use?", "ko": "무료로 쓸 수 있나요?"}, {"speaker": "staff", "en": "Yes. Free for everyone.", "ko": "네. 모두 무료입니다."}], [{"speaker": "visitor", "en": "Where do I return the locker key?", "ko": "라커 열쇠는 어디에 반납하나요?"}, {"speaker": "staff", "en": "Please return it here when you leave.", "ko": "나가실 때 여기로 반납해 주세요."}, {"speaker": "visitor", "en": "Should I empty the locker first?", "ko": "라커를 먼저 비워야 하나요?"}, {"speaker": "staff", "en": "Yes. Please take all your things.", "ko": "네. 모든 짐을 가져가세요."}]], "shower": [[{"speaker": "visitor", "en": "Is there a shower room?", "ko": "샤워장이 있나요?"}, {"speaker": "staff", "en": "Yes. Inside the locker room.", "ko": "네. 탈의실 안에 있습니다."}, {"speaker": "visitor", "en": "On the same floor?", "ko": "같은 층인가요?"}, {"speaker": "staff", "en": "Yes. Same floor, same room.", "ko": "네. 같은 층, 같은 공간이에요."}], [{"speaker": "visitor", "en": "Is the shower free?", "ko": "샤워는 무료인가요?"}, {"speaker": "staff", "en": "Yes. Free for all visitors.", "ko": "네. 모든 방문객에게 무료입니다."}, {"speaker": "visitor", "en": "No time limit?", "ko": "시간 제한은 없나요?"}, {"speaker": "staff", "en": "Please be quick when it is busy.", "ko": "사람이 많을 때는 빨리 끝내 주세요."}], [{"speaker": "visitor", "en": "Do you give towels?", "ko": "수건을 주시나요?"}, {"speaker": "staff", "en": "Please bring your own towel.", "ko": "수건은 가져오셔야 합니다."}, {"speaker": "visitor", "en": "Can I buy one here?", "ko": "여기서 살 수 있나요?"}, {"speaker": "staff", "en": "Yes. We have small towels for sale.", "ko": "네. 작은 수건을 판매합니다."}], [{"speaker": "visitor", "en": "Is soap and shampoo provided?", "ko": "비누와 샴푸가 제공되나요?"}, {"speaker": "staff", "en": "Please bring your own.", "ko": "직접 가져오셔야 합니다."}, {"speaker": "visitor", "en": "Even basic soap?", "ko": "비누도요?"}, {"speaker": "staff", "en": "Yes. Sorry. Please bring everything you need.", "ko": "네, 죄송합니다. 필요한 건 다 가져오세요."}], [{"speaker": "visitor", "en": "Is there hot water?", "ko": "온수가 나오나요?"}, {"speaker": "staff", "en": "Yes. Hot water all day.", "ko": "네. 하루 종일 온수가 나옵니다."}, {"speaker": "visitor", "en": "Good. Thank you.", "ko": "다행이네요. 감사합니다."}, {"speaker": "staff", "en": "Please tell us if there is a problem.", "ko": "문제가 있으면 말씀해 주세요."}], [{"speaker": "visitor", "en": "What time is the shower open?", "ko": "샤워장은 몇 시에 여나요?"}, {"speaker": "staff", "en": "Same as the center. 6 AM to 10 PM.", "ko": "센터와 같습니다. 오전 6시부터 밤 10시까지요."}, {"speaker": "visitor", "en": "Last time to use?", "ko": "마지막 이용 시간은요?"}, {"speaker": "staff", "en": "Please finish before 9:50 PM.", "ko": "밤 9시 50분 전에 끝내 주세요."}], [{"speaker": "visitor", "en": "Is there a long wait?", "ko": "기다려야 하나요?"}, {"speaker": "staff", "en": "Usually no. Try after the busy time.", "ko": "보통은 아니에요. 붐비는 시간 이후에 가보세요."}, {"speaker": "visitor", "en": "When is busy time?", "ko": "붐비는 시간이 언제인가요?"}, {"speaker": "staff", "en": "Around 7 to 9 PM is the busiest.", "ko": "저녁 7시부터 9시까지가 가장 붐빕니다."}], [{"speaker": "visitor", "en": "Do I need shower sandals?", "ko": "샤워 슬리퍼가 필요한가요?"}, {"speaker": "staff", "en": "It is a good idea. Please bring them.", "ko": "있으면 좋아요. 가져오시는 게 좋습니다."}, {"speaker": "visitor", "en": "I forgot mine.", "ko": "안 가져왔어요."}, {"speaker": "staff", "en": "That's okay. Please be careful on wet floor.", "ko": "괜찮습니다. 젖은 바닥 조심하세요."}], [{"speaker": "visitor", "en": "Can my child shower here?", "ko": "아이가 여기서 샤워할 수 있나요?"}, {"speaker": "staff", "en": "Yes. Please go with a parent.", "ko": "네. 부모와 함께 가세요."}, {"speaker": "visitor", "en": "Is there a family room?", "ko": "가족 샤워실이 있나요?"}, {"speaker": "staff", "en": "Sorry. We only have men's and women's.", "ko": "죄송합니다. 남자, 여자만 있어요."}], [{"speaker": "visitor", "en": "Can I leave my things in the shower?", "ko": "샤워실에 물건을 두어도 되나요?"}, {"speaker": "staff", "en": "Please use the locker.", "ko": "라커를 이용해 주세요."}, {"speaker": "visitor", "en": "Is the shower area not safe?", "ko": "샤워실은 안전하지 않나요?"}, {"speaker": "staff", "en": "Lockers are safer. Please use them.", "ko": "라커가 더 안전해요. 그걸 이용해 주세요."}]], "restroom": [[{"speaker": "visitor", "en": "Where is the restroom?", "ko": "화장실이 어디인가요?"}, {"speaker": "staff", "en": "Right over there, on this floor.", "ko": "바로 저쪽, 이 층에 있어요."}, {"speaker": "visitor", "en": "Which side?", "ko": "어느 쪽이요?"}, {"speaker": "staff", "en": "Go straight, then turn left.", "ko": "똑바로 가서 왼쪽으로 가세요."}], [{"speaker": "visitor", "en": "Which one is the men's room?", "ko": "남자 화장실은 어느 쪽인가요?"}, {"speaker": "staff", "en": "Blue sign for men, red sign for women.", "ko": "파란 표시가 남자, 빨간 표시가 여자입니다."}, {"speaker": "visitor", "en": "I see. Got it.", "ko": "알겠습니다."}, {"speaker": "staff", "en": "You're welcome.", "ko": "별말씀을요."}], [{"speaker": "visitor", "en": "Is there a restroom on the second floor?", "ko": "2층에도 화장실이 있나요?"}, {"speaker": "staff", "en": "Yes. Every floor has one.", "ko": "네. 모든 층에 있어요."}, {"speaker": "visitor", "en": "Near the badminton court?", "ko": "배드민턴장 근처에요?"}, {"speaker": "staff", "en": "Yes. Just outside the gym.", "ko": "네. 체육관 바로 밖에 있어요."}], [{"speaker": "visitor", "en": "Is there an accessible restroom?", "ko": "장애인용 화장실이 있나요?"}, {"speaker": "staff", "en": "Yes. Next to the regular restroom.", "ko": "네. 일반 화장실 옆에 있어요."}, {"speaker": "visitor", "en": "Is it open now?", "ko": "지금 이용 가능한가요?"}, {"speaker": "staff", "en": "Yes. Always open during opening hours.", "ko": "네. 운영 시간 동안 항상 열려 있습니다."}], [{"speaker": "visitor", "en": "Is there a family restroom?", "ko": "가족 화장실이 있나요?"}, {"speaker": "staff", "en": "Sorry. We don't have one.", "ko": "죄송합니다. 없습니다."}, {"speaker": "visitor", "en": "I have a small child.", "ko": "어린아이가 있어요."}, {"speaker": "staff", "en": "Small children can come with a parent.", "ko": "어린아이는 부모와 함께 들어갈 수 있어요."}], [{"speaker": "visitor", "en": "Is there a baby changing table?", "ko": "기저귀 교환대가 있나요?"}, {"speaker": "staff", "en": "Yes, in the women's restroom.", "ko": "네, 여자 화장실에 있습니다."}, {"speaker": "visitor", "en": "Not in the men's room?", "ko": "남자 화장실에는요?"}, {"speaker": "staff", "en": "Sorry. Not yet.", "ko": "죄송합니다. 아직 없어요."}], [{"speaker": "visitor", "en": "Is there toilet paper inside?", "ko": "화장실에 휴지가 있나요?"}, {"speaker": "staff", "en": "Yes. We refill it every day.", "ko": "네. 매일 채워 넣습니다."}, {"speaker": "visitor", "en": "What if it is empty?", "ko": "다 떨어졌으면요?"}, {"speaker": "staff", "en": "Please tell us. We will refill it.", "ko": "말씀해 주세요. 채워드리겠습니다."}], [{"speaker": "visitor", "en": "The restroom is dirty.", "ko": "화장실이 더러워요."}, {"speaker": "staff", "en": "I am sorry. I will clean it now.", "ko": "죄송합니다. 지금 청소하겠습니다."}, {"speaker": "visitor", "en": "Thank you.", "ko": "감사합니다."}, {"speaker": "staff", "en": "Thank you for telling us.", "ko": "알려주셔서 감사합니다."}], [{"speaker": "visitor", "en": "Are the restrooms always open?", "ko": "화장실은 항상 열려 있나요?"}, {"speaker": "staff", "en": "During opening hours, yes.", "ko": "운영 시간 동안은 열려 있어요."}, {"speaker": "visitor", "en": "6 AM to 10 PM?", "ko": "오전 6시부터 밤 10시까지요?"}, {"speaker": "staff", "en": "Yes. Same as the center.", "ko": "네. 센터와 같습니다."}], [{"speaker": "visitor", "en": "I just need the restroom. Is that okay?", "ko": "화장실만 쓰고 싶은데, 괜찮나요?"}, {"speaker": "staff", "en": "Of course. Please come in.", "ko": "물론입니다. 들어오세요."}, {"speaker": "visitor", "en": "Where do I go?", "ko": "어디로 가야 하나요?"}, {"speaker": "staff", "en": "Straight ahead, then on your left.", "ko": "똑바로 가셔서 왼쪽에 있어요."}]], "lostfound": [[{"speaker": "visitor", "en": "I lost my phone.", "ko": "휴대폰을 잃어버렸어요."}, {"speaker": "staff", "en": "I am sorry. When did you lose it?", "ko": "유감입니다. 언제 잃어버리셨어요?"}, {"speaker": "visitor", "en": "About one hour ago.", "ko": "약 1시간 전쯤이요."}, {"speaker": "staff", "en": "Let me check our lost and found.", "ko": "분실물함을 확인해 보겠습니다."}], [{"speaker": "visitor", "en": "I can't find my wallet.", "ko": "지갑이 안 보여요."}, {"speaker": "staff", "en": "Where did you use it last?", "ko": "마지막으로 어디서 쓰셨어요?"}, {"speaker": "visitor", "en": "Maybe the locker room.", "ko": "아마도 탈의실이요."}, {"speaker": "staff", "en": "Let's go and check together.", "ko": "같이 가서 확인해 봅시다."}], [{"speaker": "visitor", "en": "I lost a black bag.", "ko": "검정색 가방을 잃어버렸어요."}, {"speaker": "staff", "en": "Big or small?", "ko": "크기는 어떤가요?"}, {"speaker": "visitor", "en": "A small backpack.", "ko": "작은 배낭이에요."}, {"speaker": "staff", "en": "I will check. Please wait a moment.", "ko": "확인해 보겠습니다. 잠시만 기다려 주세요."}], [{"speaker": "staff", "en": "Is this your bag?", "ko": "이 가방이 손님 거 맞나요?"}, {"speaker": "visitor", "en": "Yes! That's mine. Thank you!", "ko": "네! 제 거예요. 감사합니다!"}, {"speaker": "staff", "en": "Please check inside. Is everything there?", "ko": "안을 확인해 주세요. 다 있나요?"}, {"speaker": "visitor", "en": "Yes, everything is here.", "ko": "네, 다 있어요."}], [{"speaker": "visitor", "en": "Did you find my keys?", "ko": "제 열쇠 찾으셨나요?"}, {"speaker": "staff", "en": "Sorry, not yet.", "ko": "죄송합니다, 아직이요."}, {"speaker": "visitor", "en": "What should I do?", "ko": "어떻게 해야 하나요?"}, {"speaker": "staff", "en": "Please leave your number. I will call you.", "ko": "번호를 남겨주세요. 연락드릴게요."}], [{"speaker": "visitor", "en": "I think someone took my watch.", "ko": "누가 제 시계를 가져간 것 같아요."}, {"speaker": "staff", "en": "I am very sorry. Where was it?", "ko": "정말 유감입니다. 어디 두셨었어요?"}, {"speaker": "visitor", "en": "On the bench in the locker room.", "ko": "탈의실 벤치 위에요."}, {"speaker": "staff", "en": "Let me call my supervisor.", "ko": "관리자를 부르겠습니다."}], [{"speaker": "visitor", "en": "Should I call the police?", "ko": "경찰에 신고해야 할까요?"}, {"speaker": "staff", "en": "First, let's search carefully.", "ko": "먼저 잘 찾아봅시다."}, {"speaker": "visitor", "en": "And if we don't find it?", "ko": "그래도 못 찾으면요?"}, {"speaker": "staff", "en": "Then yes, please call 112.", "ko": "그러면 네, 112에 신고하세요."}], [{"speaker": "visitor", "en": "How long do you keep lost items?", "ko": "분실물은 얼마나 보관하시나요?"}, {"speaker": "staff", "en": "We keep them for a few weeks.", "ko": "몇 주 동안 보관합니다."}, {"speaker": "visitor", "en": "What happens after that?", "ko": "그 후에는요?"}, {"speaker": "staff", "en": "They go to the city lost and found office.", "ko": "시 분실물 보관소로 보냅니다."}], [{"speaker": "visitor", "en": "Can I pick up my umbrella?", "ko": "제 우산 가져갈 수 있나요?"}, {"speaker": "staff", "en": "May I see your ID, please?", "ko": "신분증 좀 보여주실 수 있나요?"}, {"speaker": "visitor", "en": "Here you go.", "ko": "여기 있습니다."}, {"speaker": "staff", "en": "Thank you. Here is your umbrella.", "ko": "감사합니다. 우산 여기 있습니다."}], [{"speaker": "visitor", "en": "Do I need to fill out a form?", "ko": "양식을 작성해야 하나요?"}, {"speaker": "staff", "en": "Yes. A short lost-item report.", "ko": "네. 간단한 분실 신고서입니다."}, {"speaker": "visitor", "en": "Is it in English?", "ko": "영어로 되어 있나요?"}, {"speaker": "staff", "en": "Sorry, Korean only. I will help you.", "ko": "죄송합니다, 한국어만 있어요. 제가 도와드릴게요."}]], "parking": [[{"speaker": "visitor", "en": "Where is the parking lot?", "ko": "주차장이 어디인가요?"}, {"speaker": "staff", "en": "Right next to this building.", "ko": "이 건물 바로 옆에 있어요."}, {"speaker": "visitor", "en": "Outdoor or indoor?", "ko": "실외인가요, 실내인가요?"}, {"speaker": "staff", "en": "Outdoor parking lot.", "ko": "야외 주차장입니다."}], [{"speaker": "visitor", "en": "How much is parking?", "ko": "주차 요금이 얼마예요?"}, {"speaker": "staff", "en": "Parking is free for visitors.", "ko": "방문객은 무료입니다."}, {"speaker": "visitor", "en": "Really? Free?", "ko": "정말요? 무료요?"}, {"speaker": "staff", "en": "Yes. Please use the lot any time.", "ko": "네. 언제든 이용하세요."}], [{"speaker": "visitor", "en": "The parking lot is full.", "ko": "주차장이 꽉 찼어요."}, {"speaker": "staff", "en": "Sorry. Please try the stadium parking.", "ko": "죄송합니다. 경기장 주차장도 이용해 보세요."}, {"speaker": "visitor", "en": "Is that far?", "ko": "거기 먼가요?"}, {"speaker": "staff", "en": "No. Just up the hill, 2 minutes by car.", "ko": "아니요. 언덕 위, 차로 2분이요."}], [{"speaker": "visitor", "en": "Is there a time limit?", "ko": "시간 제한이 있나요?"}, {"speaker": "staff", "en": "No limit during opening hours.", "ko": "운영 시간 동안은 제한 없어요."}, {"speaker": "visitor", "en": "Until 10 PM?", "ko": "밤 10시까지요?"}, {"speaker": "staff", "en": "Yes. Please leave before we close.", "ko": "네. 닫기 전에 나가 주세요."}], [{"speaker": "visitor", "en": "Is there accessible parking?", "ko": "장애인 주차구역이 있나요?"}, {"speaker": "staff", "en": "Yes. Near the entrance.", "ko": "네. 입구 가까이에 있어요."}, {"speaker": "visitor", "en": "Do I need a permit?", "ko": "허가증이 필요한가요?"}, {"speaker": "staff", "en": "Yes. Please show your disability card.", "ko": "네. 장애인 카드를 보여주세요."}], [{"speaker": "visitor", "en": "Where is the parking entrance?", "ko": "주차장 입구가 어디인가요?"}, {"speaker": "staff", "en": "Right side of the building.", "ko": "건물 오른쪽이에요."}, {"speaker": "visitor", "en": "And the exit?", "ko": "출구는요?"}, {"speaker": "staff", "en": "Same place. One way in and out.", "ko": "같은 곳이에요. 한 길로 들어오고 나갑니다."}], [{"speaker": "visitor", "en": "Can I park my bicycle?", "ko": "자전거를 세워도 되나요?"}, {"speaker": "staff", "en": "Yes. Bicycle rack is near the entrance.", "ko": "네. 자전거 거치대가 입구 근처에 있어요."}, {"speaker": "visitor", "en": "Free of charge?", "ko": "무료인가요?"}, {"speaker": "staff", "en": "Yes. Always free.", "ko": "네. 항상 무료입니다."}], [{"speaker": "visitor", "en": "I can't find my car.", "ko": "제 차를 못 찾겠어요."}, {"speaker": "staff", "en": "What color is your car?", "ko": "어떤 색 차예요?"}, {"speaker": "visitor", "en": "A white sedan.", "ko": "흰색 세단이요."}, {"speaker": "staff", "en": "Let's walk to the parking lot together.", "ko": "주차장으로 함께 가봅시다."}], [{"speaker": "visitor", "en": "Can I leave my car overnight?", "ko": "차를 밤새 둘 수 있나요?"}, {"speaker": "staff", "en": "Sorry. No overnight parking.", "ko": "죄송합니다. 야간 주차는 안 됩니다."}, {"speaker": "visitor", "en": "Until what time can I stay?", "ko": "몇 시까지 있을 수 있나요?"}, {"speaker": "staff", "en": "Until 10 PM, when we close.", "ko": "센터가 닫는 밤 10시까지요."}], [{"speaker": "visitor", "en": "Can I use the stadium parking?", "ko": "경기장 주차장도 쓸 수 있나요?"}, {"speaker": "staff", "en": "Yes. It is also free.", "ko": "네. 거기도 무료예요."}, {"speaker": "visitor", "en": "Even when there is no game?", "ko": "경기가 없을 때도요?"}, {"speaker": "staff", "en": "Yes, no problem.", "ko": "네, 문제없습니다."}]], "equipment": [[{"speaker": "visitor", "en": "What equipment can I rent?", "ko": "어떤 장비를 빌릴 수 있나요?"}, {"speaker": "staff", "en": "Skates, paddles, and rackets.", "ko": "스케이트, 라켓 등을 빌릴 수 있어요."}, {"speaker": "visitor", "en": "Where do I rent them?", "ko": "어디서 빌리나요?"}, {"speaker": "staff", "en": "At each sports area.", "ko": "각 운동 시설에서요."}], [{"speaker": "visitor", "en": "How much is skate rental?", "ko": "스케이트 대여료가 얼마인가요?"}, {"speaker": "staff", "en": "2,500 won for one pair.", "ko": "한 켤레에 2,500원입니다."}, {"speaker": "visitor", "en": "Do you have all sizes?", "ko": "사이즈가 다 있나요?"}, {"speaker": "staff", "en": "What size do you need?", "ko": "어떤 사이즈가 필요하세요?"}], [{"speaker": "visitor", "en": "I wear size 270.", "ko": "270 사이즈 신어요."}, {"speaker": "staff", "en": "Let me check. Just a moment.", "ko": "확인해 보겠습니다. 잠시만요."}, {"speaker": "visitor", "en": "Thanks.", "ko": "감사합니다."}, {"speaker": "staff", "en": "Yes, we have your size.", "ko": "네, 사이즈 있습니다."}], [{"speaker": "visitor", "en": "Can I rent a badminton racket?", "ko": "배드민턴 라켓을 빌릴 수 있나요?"}, {"speaker": "staff", "en": "Please ask at the gym on the second floor.", "ko": "2층 체육관에 문의해 주세요."}, {"speaker": "visitor", "en": "Do they have shuttlecocks too?", "ko": "셔틀콕도 있나요?"}, {"speaker": "staff", "en": "Sometimes. Please ask them.", "ko": "있을 때도 있어요. 그곳에 물어보세요."}], [{"speaker": "visitor", "en": "Do I need to leave a deposit?", "ko": "보증금을 내야 하나요?"}, {"speaker": "staff", "en": "Sometimes yes, an ID is also okay.", "ko": "때로는 필요해요. 신분증도 됩니다."}, {"speaker": "visitor", "en": "I have my passport.", "ko": "여권이 있어요."}, {"speaker": "staff", "en": "That is fine. Thank you.", "ko": "괜찮습니다. 감사합니다."}], [{"speaker": "visitor", "en": "Where do I return the equipment?", "ko": "장비는 어디에 반납하나요?"}, {"speaker": "staff", "en": "Same place where you rented it.", "ko": "빌린 곳에 돌려주세요."}, {"speaker": "visitor", "en": "Before closing time?", "ko": "닫는 시간 전에요?"}, {"speaker": "staff", "en": "Yes. Please return before 10 PM.", "ko": "네. 밤 10시 전에 반납해 주세요."}], [{"speaker": "visitor", "en": "I broke the racket. I am sorry.", "ko": "라켓을 부러뜨렸어요. 죄송합니다."}, {"speaker": "staff", "en": "It's okay. Accidents happen.", "ko": "괜찮습니다. 그럴 수 있어요."}, {"speaker": "visitor", "en": "Do I need to pay?", "ko": "비용을 내야 하나요?"}, {"speaker": "staff", "en": "Maybe a small fee. Please ask the staff.", "ko": "약간의 비용이 있을 수 있어요. 직원에게 문의하세요."}], [{"speaker": "visitor", "en": "Can I rent a helmet?", "ko": "헬멧을 빌릴 수 있나요?"}, {"speaker": "staff", "en": "Yes, for the ice rink.", "ko": "네, 빙상장에서요."}, {"speaker": "visitor", "en": "Is it free?", "ko": "무료인가요?"}, {"speaker": "staff", "en": "Please ask at the ice rink counter.", "ko": "빙상장 카운터에 문의해 주세요."}], [{"speaker": "visitor", "en": "Do you have kid-size equipment?", "ko": "아이용 장비도 있나요?"}, {"speaker": "staff", "en": "Yes. Small skates and helmets too.", "ko": "네. 작은 스케이트와 헬멧도 있어요."}, {"speaker": "visitor", "en": "Same price?", "ko": "가격은 같나요?"}, {"speaker": "staff", "en": "Yes. Same price for kids and adults.", "ko": "네. 아이도 어른도 같은 가격입니다."}], [{"speaker": "visitor", "en": "Can I buy gloves here?", "ko": "여기서 장갑을 살 수 있나요?"}, {"speaker": "staff", "en": "Yes. We sell them at the ice rink.", "ko": "네. 빙상장에서 팝니다."}, {"speaker": "visitor", "en": "How much?", "ko": "얼마예요?"}, {"speaker": "staff", "en": "Around 5,000 won.", "ko": "약 5,000원입니다."}]], "fees": [[{"speaker": "visitor", "en": "Is there an entry fee for the center?", "ko": "센터 입장료가 있나요?"}, {"speaker": "staff", "en": "No entry fee. The center is free.", "ko": "입장료는 없어요. 센터 입장은 무료입니다."}, {"speaker": "visitor", "en": "Do I pay only when I play?", "ko": "운동할 때만 내나요?"}, {"speaker": "staff", "en": "Yes. Each sport has its own price.", "ko": "네. 종목별로 가격이 다릅니다."}], [{"speaker": "visitor", "en": "How much for the ice rink?", "ko": "빙상장은 얼마인가요?"}, {"speaker": "staff", "en": "3,000 won for adults.", "ko": "성인 3,000원입니다."}, {"speaker": "visitor", "en": "Plus skate rental?", "ko": "스케이트 대여는 별도인가요?"}, {"speaker": "staff", "en": "Yes. 2,500 won extra for skates.", "ko": "네. 스케이트 대여 2,500원이 추가됩니다."}], [{"speaker": "visitor", "en": "Badminton price on weekdays?", "ko": "평일 배드민턴 가격은요?"}, {"speaker": "staff", "en": "20,000 won for 2 hours, daytime.", "ko": "주간 2시간 2만 원입니다."}, {"speaker": "visitor", "en": "Evening?", "ko": "저녁은요?"}, {"speaker": "staff", "en": "25,000 won in the evening.", "ko": "저녁은 2만 5천 원입니다."}], [{"speaker": "visitor", "en": "What about weekend prices?", "ko": "주말 가격은요?"}, {"speaker": "staff", "en": "25,000 daytime, 30,000 at night.", "ko": "주간 2만 5천 원, 야간 3만 원입니다."}, {"speaker": "vi ご10じまで。"}]], "location": [[{"speaker": "visitor", "en": "卓球室はどこですか？", "ko": "탁구장이 어디인가요?", "pron": "たっきゅうしつはどこですか？"}, {"speaker": "staff", "en": "1階にあります。", "ko": "1층에 있습니다.", "pron": "1かいにあります。"}, {"speaker": "visitor", "en": "近いですか？", "ko": "여기서 가깝나요?", "pron": "ちかいですか？"}, {"speaker": "staff", "en": "はい、まっすぐです。すぐそこです。", "ko": "네. 똑바로 가세요. 바로 저기예요."}], [{"speaker": "visitor", "en": "バドミントンコートはどこですか？", "ko": "배드민턴장이 어디인가요?"}, {"speaker": "staff", "en": "2階にございます。", "ko": "2층에 있습니다.", "pron": "2かいにございます。"}, {"speaker": "visitor", "en": "どうやって上に行きますか？", "ko": "어떻게 올라가나요?", "pron": "どうやってうえにいきますか？"}, {"speaker": "staff", "en": "エレベーターはあちら、階段もあります。", "ko": "엘리베이터는 저쪽에 있어요. 계단도 있습니다.", "pron": "エレベーターはあちら、かいだんもあります。"}], [{"speaker": "visitor", "en": "スカッシュコートを探しています。", "ko": "스쿼시장을 찾고 있어요.", "pron": "スカッシュコートをさがしています。"}, {"speaker": "staff", "en": "1階、卓球室の隣です。", "ko": "1층, 탁구장 옆에 있습니다.", "pron": "1かい、たっきゅうしつのとなりです。"}, {"speaker": "visitor", "en": "卓球室と同じ階ですか？", "ko": "탁구장과 같은 층인가요?", "pron": "たっきゅうしつとおなじかいですか？"}, {"speaker": "staff", "en": "はい、どちらも1階にあります。", "ko": "네. 둘 다 1층에 있어요.", "pron": "はい、どちらも1かいにあります。"}], [{"speaker": "visitor", "en": "メインスタジアムはどこですか？", "ko": "주경기장이 어디인가요?"}, {"speaker": "staff", "en": "外に出てまっすぐ上へ。", "ko": "밖으로 나가서 위쪽으로 똑바로 걸어가세요.", "pron": "そとにでてまっすぐうえへ。"}, {"speaker": "visitor", "en": "どのくらいかかりますか？", "ko": "얼마나 멀어요?"}, {"speaker": "staff", "en": "約150メートル。大きな建物が見えます。", "ko": "약 150미터요. 큰 건물이 보일 거예요.", "pron": "やく150メートル。おおきなたてものがみえます。"}], [{"speaker": "visitor", "en": "バスケットボールはどこでできますか？", "ko": "농구는 어디서 할 수 있나요?"}, {"speaker": "staff", "en": "2階です。バドミントンと同じ場所です。", "ko": "2층이요. 배드민턴장과 같은 곳입니다.", "pron": "2かいです。バドミントンとおなじばしょです。"}, {"speaker": "visitor", "en": "バレーボールは？", "ko": "배구는요?"}, {"speaker": "staff", "en": "こちらも2階です。同じコートです。", "ko": "그것도 2층이에요. 같은 코트입니다.", "pron": "こちらも2かいです。おなじコートです。"}], [{"speaker": "visitor", "en": "インフォメーションはどこですか？", "ko": "안내 데스크가 어디인가요?"}, {"speaker": "staff", "en": "ここです、1階にあります。", "ko": "여기 1층에 있습니다.", "pron": "ここで ": "staff", "en": "お子様は何歳ですか？", "ko": "아이가 몇 살인가요?", "pron": "おこさまはなんさいですか？"}, {"speaker": "visitor", "en": "7歳です。", "ko": "7살이에요.", "pron": "7さいです。"}, {"speaker": "staff", "en": "わかりました。氷の上ではお子様のそばにいてください。", "ko": "네. 빙판에서 아이 옆에 꼭 붙어 계세요.", "pron": "わかりました。こおりのうえではおこさまのそばにいてください。"}]], "tabletennis": [[{"speaker": "visitor", "en": "卓球室はどこですか？", "ko": "탁구장이 어디인가요?", "pron": "たっきゅうしつはどこですか？"}, {"speaker": "staff", "en": "1階です。すぐあちらです。", "ko": "1층입니다. 바로 저쪽이에요.", "pron": "1かいです。すぐあちらです。"}, {"speaker": "visitor", "en": "ここと同じ階ですか？", "ko": "여기랑 같은 층인가요?", "pron": "こことおなじかいですか？"}, {"speaker": "staff", "en": "はい、まっすぐ歩いてください。", "ko": "네. 똑바로 가시면 됩니다.", "pron": "はい、まっすぐあるいてください。"}], [{"speaker": "visitor", "en": "卓球室は何時まで開いていますか？", "ko": "탁구장은 몇 시에 여나요?", "pron": "たっきゅうしつはなんじまであいていますか？"}, {"speaker": "staff", "en": "午前6時から午後10時までです。", "ko": "오전 6시부터 밤 10시까지요.", "pron": "ごぜん6じからごご10じまでです。"}, {"speaker": "visitor", "en": "毎日ですか？", "ko": "매일이요?", "pron": "まいにちですか？"}, {"speaker": "staff", "en": "月曜日と祝日は休館です。", "ko": "월요일과 공휴일은 쉽니다.", "pron": "げつようびとしゅくじつはきゅうかんです。"}], [{"speaker": "visitor", "en": "今すぐ卓球できますか？", "ko": "지금 탁구 칠 수 있나요?", "pron": "いますぐたっきゅうできますか？"}, {"speaker": "staff", "en": "はい、今卓球台は空いています。", "ko": "네. 지금 테이블 이용 가능합니다.", "pron": "はい、いまたっきゅうだいはあいています。"}, {"speaker": "visitor", "en": "予約は必要ですか？", "ko": "예약해야 하나요?", "pron": "よやくはひつようですか？"}, {"speaker": "staff", "en": "いいえ、そのまま入ってプレーできます。", "ko": "아니요. 들어가서 그냥 치시면 돼요.", "pron": "いいえ、そのままはいってプレーできます。"}], [{"speaker": "visitor", "en": "ラケットを持っていません。", "ko": "라켓이 없어요.", "pron": "ラケットをもっていません。"}, {"speaker": "staff", "en": "中でレンタルできます。", "ko": "안에서 빌릴 수 있습니다.", "pron": "なかでレンタルできます。"}, {"speaker": "visitor", "en": "レンタル料金はいくらですか？", "ko": "대여료가 얼마인가요?", "pron": "レンタルりょうきんはいくらですか？"}, {"speaker": "staff", "en": "室内のスタッフにお尋ねください。", "ko": "안에 있는 직원에게 문의해 주세요.", "pron": "しつないのスタッフにおたずねください。"}], [{"speaker": "visitor", "en": "卓球ボールはありますか？", "ko": "탁구공이 있나요?", "pron": "たっきゅうボールはありますか？"}, {"speaker": "staff", "en": "はい、中のスタッフがお渡しし
